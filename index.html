<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03130f">
<title>아라호 관제센터 · 시즌 2</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* ─────────────────────────────────────────────────────────
   아라호 관제센터 — 디자인 토큰
   서체: 제목 Noto Serif KR 900 (고전적·우주 다큐 자막 느낌) / 본문 Noto Sans KR
   레이아웃: 16:9 전자칠판 기준 1600px 폭, 학습 슬라이드는 좌 글·우 사진 2단
   ───────────────────────────────────────────────────────── */
:root{
  --space0:#03130f; --space1:#06201a; --panel:#0d2a24; --panel2:#143a32; --line:#1f5247; --line2:#2f7a68;
  --fg:#f3f5ff; --mut:#a3cfc4; --dim:#6aa396;
  --sun:#ffb13b; --sun2:#ff7a1a; --cyan:#5fe3ff; --green:#3fe6a6; --red:#ff6b6b; --violet:#a497ff;
  --disp:'Noto Serif KR','Nanum Myeongjo',serif; --body:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box} html,body{height:100%}
body{margin:0;background:var(--space0);color:var(--fg);font-family:var(--body);font-size:18px;line-height:1.75;
  background-image:
   radial-gradient(1400px 800px at 85% -10%,#0f6b5a55,transparent 60%),
   radial-gradient(1000px 700px at -10% 110%,#0b3d4a44,transparent 60%),
   radial-gradient(1.6px 1.6px at 12% 22%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 68% 12%,#fff6 50%,transparent 51%),
   radial-gradient(1.4px 1.4px at 86% 48%,#fff5 50%,transparent 51%),radial-gradient(1px 1px at 38% 78%,#fff6 50%,transparent 51%),
   radial-gradient(1.2px 1.2px at 8% 64%,#fff4 50%,transparent 51%),radial-gradient(1px 1px at 52% 38%,#fff5 50%,transparent 51%),
   radial-gradient(1px 1px at 92% 82%,#fff5 50%,transparent 51%),radial-gradient(1.3px 1.3px at 28% 8%,#fff6 50%,transparent 51%);
  background-attachment:fixed}
h1,h2,h3,.disp{font-family:var(--disp);font-weight:900;letter-spacing:-.01em;text-wrap:balance;margin:0}
p{margin:.55em 0}
button{font-family:var(--body);font-size:1.05rem;border:0;border-radius:14px;cursor:pointer;min-height:52px;padding:10px 20px;color:var(--fg);-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.btn-p{background:linear-gradient(135deg,var(--sun),var(--sun2));color:#2a1500;font-weight:900;font-size:1.12rem;box-shadow:0 4px 18px #ff9c2a44}
.btn-s{background:var(--panel2);border:1.5px solid var(--line2)}
.btn-g{background:transparent;border:1.5px solid var(--line);color:var(--mut)}
textarea,input[type=text],input[type=password],select{width:100%;background:#04140f;color:var(--fg);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;font-size:1.12rem;font-family:var(--body);line-height:1.8}
textarea{min-height:150px;resize:vertical}
textarea::placeholder,input::placeholder{color:var(--dim)}
a{color:var(--cyan)}
.wrap{max-width:1600px;margin:0 auto;padding:18px 24px 112px}
.card{background:linear-gradient(180deg,var(--panel),#09201b);border:1.5px solid var(--line);border-radius:22px;padding:24px 26px;margin:16px 0}
.tag{display:inline-flex;align-items:center;gap:6px;background:#04140f;border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:3px 14px;font-size:.9rem}
.small{font-size:.95rem;color:var(--mut)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.crew3{display:grid;grid-template-columns:.8fr 1.1fr 1.1fr;gap:16px;align-items:start;margin-bottom:16px}
@media (max-width:1100px){.crew3{grid-template-columns:1fr 1fr}.crew3>:first-child{grid-column:1/-1}}
@media (max-width:700px){.crew3{grid-template-columns:1fr}}
@media (max-width:860px){.row2{grid-template-columns:1fr}}

/* HUD */
.hud{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:#08201bcc;border:1.5px solid var(--line);border-radius:18px;padding:12px 20px;backdrop-filter:blur(8px)}
.hud .rk{font-family:var(--disp);font-size:1.2rem;color:var(--sun)}
.hud .pt{font-variant-numeric:tabular-nums;color:var(--cyan);font-weight:700}
.hud .sync{margin-left:auto;font-size:.88rem;color:var(--dim)}
.hud #hudOut{margin-left:4px}
.hud .sync.on{color:var(--green)}
.bar{height:10px;background:#04140f;border-radius:99px;overflow:hidden;flex:1;min-width:120px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--cyan));border-radius:99px;transition:width .4s}

/* 하단 탭 */
nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#05170fee;border-top:1.5px solid var(--line);backdrop-filter:blur(10px);display:flex;justify-content:center;gap:6px;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}
nav#tabs button{background:transparent;min-height:62px;min-width:44px;flex:0 1 140px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.95rem;color:var(--mut);border-radius:14px;padding:6px 4px}
nav#tabs button .ic{font-size:1.5rem}
@media (max-width:560px){nav#tabs{gap:0}nav#tabs button{font-size:.72rem;padding:6px 1px}nav#tabs button .ic{font-size:1.25rem}}
nav#tabs button.on{background:var(--panel2);color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--line2)}
body.deckmode nav#tabs,body.gate nav#tabs{display:none}

/* 로그인 게이트 */
#gate{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--space0);
 background-image:radial-gradient(900px 600px at 70% 20%,#0f6b5a66,transparent 60%),url(img/trail_n.jpg);background-size:cover;background-position:center}
#gate::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#03130fcc,#03130ff2)}
.gatebox{position:relative;width:min(560px,100%);background:#08201bee;border:1.5px solid var(--line2);border-radius:26px;padding:34px 30px;box-shadow:0 30px 80px #000a}
.gatebox h1{font-size:2.1rem;margin-bottom:4px}
.gatebox .sub{color:var(--mut);margin:0 0 18px}
.gatebox label{display:block;font-size:.95rem;color:var(--mut);margin:10px 0 4px}
.idcard{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#143a32,#08201b);border:1.5px solid var(--line2);border-radius:18px;padding:14px 18px}
.idcard .av{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6,var(--sun));display:grid;place-items:center;font-size:1.7rem}
.idcard .nm{font-family:var(--disp);font-size:1.3rem}

/* 홈 */
.hero{position:relative;overflow:hidden;border-radius:26px;border:1.5px solid var(--line);min-height:360px;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;
 background:#06201a url(img/danuri_earth.jpg) center/cover}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#03130ff5 0%,#03130fd9 48%,#03130f55 100%)}
.hero>div{position:relative;padding:44px 40px}
.hero h1{font-size:clamp(2.2rem,4.6vw,3.6rem);line-height:1.2;text-shadow:0 0 30px #ffb13b33}
.hero .lead{color:var(--mut);font-size:1.12rem;max-width:36em;margin-top:10px}
.hero .log{font-family:var(--disp);color:var(--cyan);font-size:1rem;letter-spacing:.1em;margin-bottom:8px}
.flow{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.flow span{background:#04140fcc;border:1.5px solid var(--line);border-radius:12px;padding:8px 14px;font-size:.98rem}
.flow b{color:var(--sun)}
@media (max-width:860px){.hero{grid-template-columns:1fr;min-height:0}.hero>div{padding:28px 22px}}

/* 장 카드 */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.chap{position:relative;overflow:hidden;border:1.5px solid var(--line);border-radius:22px;padding:0;cursor:pointer;text-align:left;min-height:240px;display:flex;flex-direction:column;justify-content:flex-end;background:#06201a center/cover no-repeat;transition:transform .15s,border-color .15s}
.chap::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#03130f11 20%,#03130ff0 75%)}
.chap>*{position:relative}
.chap .in{padding:18px 20px}
.chap:active{transform:scale(.98)}
.chap.doneAll{border-color:var(--green)}
.chap h3{font-size:1.4rem;margin:4px 0 2px}
.chap .k{font-family:var(--disp);color:var(--cyan);font-size:.92rem;letter-spacing:.12em}
.dots{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.dots i{width:12px;height:12px;border-radius:99px;background:#04140f;border:1px solid var(--line)}
.dots i.on{background:var(--sun);border-color:var(--sun)}
.stamp{font-family:var(--disp);color:var(--green);border:2.5px solid var(--green);border-radius:10px;display:inline-block;padding:2px 14px;transform:rotate(-6deg);background:#06301d88}

/* ═════ 슬라이드 무대 ═════ */
#stage{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;background:var(--space0);
 background-image:radial-gradient(1200px 600px at 80% -10%,#0f6b5a55,transparent 60%),radial-gradient(1.4px 1.4px at 16% 26%,#fff7 50%,transparent 51%),radial-gradient(1px 1px at 72% 16%,#fff5 50%,transparent 51%),radial-gradient(1.3px 1.3px at 88% 56%,#fff5 50%,transparent 51%),radial-gradient(1px 1px at 34% 82%,#fff5 50%,transparent 51%)}
.stg-top{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 20px 8px}
.stg-top .ttl{font-family:var(--disp);font-size:1.1rem;color:var(--mut);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stg-top .num{font-variant-numeric:tabular-nums;color:var(--cyan);font-weight:700;font-size:1.05rem}
.stg-top button{min-height:44px;padding:6px 14px}
.rvbtn{min-height:40px;padding:4px 14px;font-size:.92rem}.rvbtn.on{border-color:var(--sun);color:var(--sun);background:#ffb13b14}
.stg-top .rvbtn{margin-left:auto}.stg-top .rvbtn+.num{margin-left:0}
.hintkey.rvmsg{color:var(--sun)}
@media (max-width:700px){.stg-top .rvbtn{font-size:.8rem;padding:2px 8px}}
.pbar{height:5px;background:#04140f}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--cyan));transition:width .35s}
.stg-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:16px 28px 10px;display:flex}
.slide{margin:auto;width:100%;max-width:1560px}
.stg-nav{position:relative;display:flex;gap:12px;padding:10px 20px calc(12px + env(safe-area-inset-bottom,0px));align-items:center}
.stg-nav button{font-size:1.15rem;min-height:58px}
.stg-nav .prev{flex:0 0 160px}.stg-nav .next{flex:1;max-width:420px;margin-left:auto}
.stg-nav .hintkey{color:var(--dim);font-size:.85rem;flex:1;text-align:center}
@media (max-width:700px){.stg-nav{flex-wrap:wrap}.stg-nav .hintkey:not(.lockmsg){display:none}.stg-nav .lockmsg{flex:1 1 100%;order:-1;font-size:.9rem}.stg-nav .prev{flex:1}.stg-nav .next{max-width:none}.stg-body{padding:14px 16px 8px}}

/* 슬라이드 타이포 — 뷰포트 기준으로 크게 */
.s-kicker{font-family:var(--disp);color:var(--cyan);font-size:clamp(.95rem,1.2vw,1.15rem);letter-spacing:.14em;margin-bottom:6px}
.s-title{font-family:var(--disp);font-weight:900;font-size:clamp(1.8rem,3.4vw,3rem);line-height:1.25;margin:2px 0 16px}
.s-body{font-size:clamp(1.15rem,1.65vw,1.5rem);line-height:1.8}
.s-body b{color:var(--sun)} .s-body em{color:var(--cyan);font-style:normal;font-weight:700}
.s-body ul{padding-left:1.2em;margin:.4em 0} .s-body li{margin:.25em 0}
.s-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:36px;align-items:center}
.s-grid.rev{grid-template-columns:.95fr 1.05fr}
@media (max-width:900px){.s-grid,.s-grid.rev{grid-template-columns:1fr;gap:16px}}
.key{background:#04140f;border:1.5px solid var(--line);border-left:6px solid var(--sun);border-radius:14px;padding:14px 20px;margin:16px 0;font-size:clamp(1.08rem,1.4vw,1.3rem)}
.key .kt{font-family:var(--disp);color:var(--sun);display:block;margin-bottom:2px;font-size:1.05em}
/* 빈칸 — 핵심어는 눌러야 보인다 */
.blank{cursor:pointer;border-radius:6px;transition:background .2s}
.blank:not(.on){color:transparent!important;background:linear-gradient(0deg,#ffb13b33,#ffb13b33);box-shadow:inset 0 -2px 0 var(--sun);padding:0 .15em;text-shadow:none}
.blank:not(.on)::selection{color:transparent}
.blank.on{background:#ffb13b1a}
@media (prefers-reduced-motion:no-preference){.blank:not(.on){animation:bl 2.2s ease-in-out infinite}@keyframes bl{0%,100%{box-shadow:inset 0 -2px 0 var(--sun)}50%{box-shadow:inset 0 -2px 0 var(--cyan)}}}
.lockmsg{color:var(--sun);font-size:.95rem;text-align:center;flex:1}
.fig{position:relative;border-radius:20px;overflow:hidden;border:1.5px solid var(--line);background:#000}
.fig img{display:block;width:100%;height:100%;object-fit:cover}
.fig .cap{position:absolute;left:0;right:0;bottom:0;padding:26px 16px 10px;background:linear-gradient(180deg,transparent,#000c);font-size:.95rem;color:#e8ecff}
.fig .cap b{color:var(--sun)}
.fig.tall{aspect-ratio:4/3}.fig.wide{aspect-ratio:16/9}.fig.sq{aspect-ratio:1}
.figs{display:grid;gap:12px}
.figs.c2{grid-template-columns:1fr 1fr}.figs.c3{grid-template-columns:1fr 1fr 1fr}.figs.c4{grid-template-columns:repeat(4,1fr)}
@media (max-width:700px){.figs.c3,.figs.c4{grid-template-columns:1fr 1fr}}
.figure{background:#04140fcc;border:1.5px solid var(--line);border-radius:20px;padding:16px;margin:14px 0}
.figcap{color:var(--mut);font-size:.95rem;text-align:center;margin-top:8px}
svg text{font-family:var(--body)}

/* 행성 갤러리 */
.pgal{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:900px){.pgal{grid-template-columns:1fr 1fr}}
.pcard{background:#04140f;border:1.5px solid var(--line);border-radius:18px;overflow:hidden;text-align:left;padding:0;min-height:0;display:block;transition:border-color .15s}
.pcard.on{border-color:var(--sun)}
.pcard .ph{aspect-ratio:1;background:#000 center/cover no-repeat}
.pcard .nm{font-family:var(--disp);font-size:clamp(1.1rem,1.5vw,1.4rem);padding:10px 14px 2px}
.pcard .ft{padding:0 14px 12px;font-size:clamp(.95rem,1.15vw,1.08rem);color:var(--mut);line-height:1.55}
.pcard .ft b{color:var(--sun)}

/* 히어로 */
.s-hero{text-align:center}
.s-hero .s-title{font-size:clamp(2.2rem,4.6vw,3.8rem)}
.s-hero .s-sub{color:var(--mut);font-size:clamp(1.05rem,1.4vw,1.3rem);max-width:34em;margin:0 auto 10px}
.comms{display:inline-block;font-family:var(--disp);color:var(--cyan);border:1px solid var(--line2);border-radius:999px;padding:4px 16px;font-size:.95rem;letter-spacing:.08em;margin-bottom:8px;background:#04140faa}
.herogrid{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center;text-align:left}
@media (max-width:900px){.herogrid{grid-template-columns:1fr}}

/* 퀴즈·피드백 */
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--panel2);border:1.5px solid var(--line2);margin:10px 0;font-size:clamp(1.1rem,1.5vw,1.35rem);padding:16px 20px;border-radius:16px}
.opt .n{font-family:var(--disp);color:var(--cyan);flex:0 0 auto}
.opt.ok{background:#0d3a2455;border-color:var(--green)}
.opt.no{background:#43182055;border-color:var(--red)}
@media (prefers-reduced-motion:no-preference){.opt.no{animation:shake .3s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}}
.fb{border-radius:16px;padding:14px 18px;margin-top:14px;font-size:1.08rem}
.fb.ok{background:#0d3a2455;border:1.5px solid var(--green)}
.fb.no{background:#3a2a1055;border:1.5px solid var(--sun)}
.cklist{list-style:none;padding:0;margin:8px 0}
.cklist li{padding:4px 0}
.cklist .y::before{content:"✔ ";color:var(--green)} .cklist .n::before{content:"✦ ";color:var(--sun)}
@media (max-width:900px){.grwrap>.figure{order:-1}}
.sortgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:700px){.sortgrid{grid-template-columns:repeat(2,1fr)}}
.sortcard{position:relative;display:flex;flex-direction:column;padding:0;overflow:hidden;border-radius:16px;background:var(--panel2);border:3px solid var(--line2);text-align:center}
.sortcard .ph{display:block;height:clamp(110px,15vh,170px);background-size:cover;background-position:center}
.sortcard .no{position:absolute;left:8px;top:6px;font-size:1.3rem;font-weight:900;color:#fff;text-shadow:0 1px 4px #000}
.sortcard .nm{font-weight:900;font-size:1.1rem;padding:6px 0 0}.sortcard .tg{font-size:.98rem;color:var(--mut);padding:2px 0 8px}
.sortcard.s{border-color:var(--sun)}.sortcard.s .tg{color:var(--sun);font-weight:700}
.sortcard.a{border-color:var(--violet)}.sortcard.a .tg{color:var(--violet);font-weight:700}
.sortcard.n{box-shadow:0 0 0 3px var(--red)}
table.sumtab td.ga,table.sumtab th.ga{background:#6b4208;color:#ffe2a8} table.sumtab td.gb,table.sumtab th.gb{background:#0d3a73;color:#d4ebff}
table.sumtab td:nth-child(2){font-weight:900;color:var(--sun)}
table.sumtab .tb{display:inline-block;min-width:5.5em;font-weight:700}
.tlink{display:block;margin:14px auto 0;background:none;border:0;color:var(--cyan);font-size:1rem;text-decoration:underline;text-underline-offset:4px;min-height:40px}
.guestbox{margin-top:10px;padding:14px 16px;border:1.5px solid var(--violet);border-radius:16px;background:#a497ff12}
.guestbox h3{margin:0 0 4px;color:var(--violet)}
.gcls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.gcls button{min-height:44px;background:var(--panel2);border:1.5px solid var(--line2);border-radius:12px}
.gcls button:disabled{opacity:.35}
.gcls button.gon{grid-column:1/-1;border-color:var(--violet);color:var(--fg);font-weight:900;font-size:1.1rem;min-height:56px;background:#a497ff22}
.greet{position:fixed;left:50%;top:18px;z-index:80;transform:translate(-50%,-20px);opacity:0;transition:all .4s;display:flex;gap:14px;align-items:center;max-width:min(680px,92vw);background:#121a46f2;border:1.5px solid var(--violet);border-radius:18px;padding:14px 20px;box-shadow:0 18px 50px #000a;cursor:pointer;line-height:1.55}
.greet.on{transform:translate(-50%,0);opacity:1}.greet.out{opacity:0;transform:translate(-50%,-20px)}
.volmeta{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;background:#04140f;border:1.5px solid var(--line);border-radius:14px;padding:8px 16px;margin:0 0 12px}
.volmeta .vm{display:flex;align-items:center;gap:8px;font-size:1.02rem;line-height:1.35}
.volopts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.volopts .opt{justify-content:center;font-weight:700}
.volcalc{display:grid;gap:8px;margin-top:12px}
.volcalc>div{background:#04140f;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;font-size:clamp(1rem,1.25vw,1.15rem);line-height:1.55}
.volcalc em{color:var(--sun);font-style:normal;font-weight:900}
.volcalc .vn{color:var(--sun);font-weight:900;margin-right:6px}
.volmini{display:flex;justify-content:center;gap:18px;margin-bottom:6px}
.volmini>div{width:90px;text-align:center}
.volcount{font-size:1.3rem;margin-top:6px}.volcount b{color:var(--sun);font-size:1.8rem}
.grsteps{margin:0;padding:0;list-style:none;counter-reset:g;display:grid;gap:7px}
.grsteps li{counter-increment:g;position:relative;padding:8px 12px 8px 46px;background:#04140f;border:1.5px solid var(--line);border-radius:12px;font-size:clamp(.98rem,1.2vw,1.1rem);line-height:1.5}

.cmstat{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.cmstat span,.cmstat button{background:var(--panel);border:1.5px solid var(--line);border-radius:99px;padding:4px 14px;font-size:.95rem;color:var(--mut);min-height:0}
.cmstat b{color:var(--fg)} .cmstat button{cursor:pointer;border-color:var(--sun);color:var(--sun)} .cmstat button b{color:var(--sun)} .cmstat button.on{background:#ffb13b22}
.cmboard{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;-webkit-overflow-scrolling:touch}
.cmcol{flex:1 0 320px;max-width:520px;display:flex;flex-direction:column;max-height:calc(100vh - 290px);min-height:240px}
.cmcol>h3{font-family:var(--disp);font-size:1.05rem;background:var(--panel2);border:1.5px solid var(--line2);border-radius:14px;padding:9px 14px;margin:0 0 10px;flex-shrink:0;color:var(--fg)}
.cmcol>h3 span{float:right;color:var(--cyan);font-family:var(--body)}
.cmcol .inner{overflow-y:auto;padding-right:4px;flex:1}
.cmcol .inner::-webkit-scrollbar{width:7px} .cmcol .inner::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
.cmq{background:#06201a;border:1.5px solid var(--line);border-left:5px solid var(--sun);border-radius:14px;padding:10px 12px;margin:0 0 10px}
.cmq.done{border-left-color:var(--cyan)} .cmq.mine{box-shadow:inset 0 0 0 1.5px #ffb13b55}
.cmmeta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:.82rem;color:var(--dim)}
.cmph{color:var(--mut);font-weight:700} .cmn{margin-left:auto;color:var(--sun);font-weight:700} .cmq.done .cmn{color:var(--cyan)}
.cmtx{margin:6px 0 4px;font-size:1.08rem;line-height:1.55;color:var(--fg);word-break:keep-all;overflow-wrap:anywhere}
.cma{border-top:1px dashed var(--line);padding:6px 0 2px;font-size:.95rem;line-height:1.5}
.cma b{color:var(--cyan);font-size:.9rem} .cma.t b{color:var(--sun)} .cma.t{background:#ffb13b12;border-radius:8px;padding:6px 8px}
.cmmore,.cmrep{min-height:34px;padding:2px 10px;font-size:.88rem;background:transparent;border:1px solid var(--line);color:var(--mut);border-radius:10px;margin-top:6px}
.cmrep{color:var(--cyan);border-color:var(--line2)}
.cmbox textarea{min-height:70px;margin-top:6px}
@media (max-width:760px){.cmboard{display:block}.cmcol{max-width:none;max-height:none}.cmcol .inner{overflow:visible}}
.skybar{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin:-2px 0 12px;padding:6px 12px;background:#04140f;border:1.5px dashed var(--line2);border-radius:16px}
.skyh{font-family:var(--disp);color:var(--cyan);margin-right:4px}
.skybtn{display:inline-flex;align-items:center;min-height:36px;padding:2px 12px;border-radius:99px;background:var(--panel2);border:1.5px solid var(--line2);color:var(--fg);text-decoration:none;font-size:.98rem}
.skybtn:hover{border-color:var(--cyan);color:var(--cyan)} .skyn{margin-left:auto;color:var(--dim)}
.cmboard.two .cmcol{flex:1 1 0;max-width:none;min-width:320px}
.cmboard.two .inner{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:0 10px;align-content:start}
.cmboard.two .cmdiv{grid-column:1/-1}
.cmcol.q>h3{border-color:var(--sun);color:var(--sun)} .cmcol.k>h3{border-color:var(--green);color:var(--green)}
.cmcol.k .cmq{border-left-color:var(--green)} .cmcol.k .cmq .cmn{color:var(--green)}
.cmdiv{font-size:.88rem;font-weight:700;color:var(--mut);border-top:1px dashed var(--line2);padding-top:8px;margin:4px 0 8px}
.cmdiv b{color:var(--cyan)}
@media (max-width:760px){.cmboard.two .inner{display:block}}
.vidlink{display:block;position:relative;background-size:cover;background-position:center;text-decoration:none}.vidlink span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:76px;height:54px;border-radius:14px;background:#e00;color:#fff;font-size:1.7rem;display:grid;place-items:center}.vidlink em{position:absolute;left:0;right:0;bottom:0;padding:8px 12px;background:#000b;color:#fff;font-style:normal;font-weight:700}
/* ─────────── 시즌 2 · 지구와 달 ─────────── */
.s2tag{display:inline-block;font-family:var(--disp);letter-spacing:.14em;font-size:.95rem;color:#04202a;background:linear-gradient(90deg,var(--cyan),var(--violet));border-radius:999px;padding:3px 16px;margin:4px 0 6px}
.fig.png{background:#000}.fig.png img{object-fit:contain;padding:6%}
.actbox{margin-top:8px}
.moonring{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.moonring div{text-align:center}.moonring img{width:100%;display:block}.moonring span{font-size:.9rem;color:var(--mut)}
/* 하늘 시계 */
.skywrap{display:grid;grid-template-columns:1.6fr .9fr;gap:20px;align-items:start}
@media (max-width:1000px){.skywrap{grid-template-columns:1fr}}
.skycv{position:relative;border-radius:18px;overflow:hidden;border:1.5px solid var(--line);background:#03110d}
.skycv canvas{display:block;width:100%;height:auto}
.skyclock{position:absolute;left:14px;top:10px;font-family:var(--disp);font-size:1.25rem;color:#ffe0a8;text-shadow:0 2px 8px #000}
.skyctl{background:#04140f;border:1.5px solid var(--line);border-radius:18px;padding:14px 16px}
.dirbtn{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.dirbtn button{min-height:46px;padding:4px;background:var(--panel2);border:1.5px solid var(--line2);font-size:.98rem}
.dirbtn button.on,.btn-s.on{background:var(--cyan);color:#04202a;border-color:var(--cyan);font-weight:900}
input[type=range]{width:100%;accent-color:var(--sun);height:34px}
.skyread{margin-top:10px;font-size:.98rem;color:var(--fg);background:#0a2520;border-radius:12px;padding:8px 12px;min-height:44px}
.skyread b{color:var(--sun)}
.skyglobe{margin:10px auto 0;max-width:280px}
/* 사진 분류 */
.trgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:800px){.trgrid{grid-template-columns:1fr 1fr}}
.trcard{border:2px solid var(--line2);border-radius:18px;padding:8px;background:#04140f}
.trcard .fig{width:100%}.trcard .fig img{object-fit:cover}
.trcard.ok{border-color:var(--green)}.trcard.no{border-color:var(--red)}
.trbtn{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}
.trbtn button{min-height:42px;padding:2px;background:var(--panel2);border:1.5px solid var(--line2);font-weight:700}
.trbtn button.on{background:var(--sun);color:#2a1500;border-color:var(--sun)}
/* 공전 궤도 */
.orbbox{background:#04140f;border:1.5px solid var(--line);border-radius:20px;padding:6px;max-width:620px;margin:0 auto;width:100%;cursor:grab}
.obinfo{display:grid;gap:10px}
.obdate{font-family:var(--disp);font-size:1.8rem}
.obrow{display:flex;gap:12px;align-items:center;background:#04140f;border:1.5px solid var(--line);border-radius:16px;padding:8px 14px}
.obrow b{font-family:var(--disp);font-size:1.5rem}
.obrow.mid{border-color:var(--cyan)}.obrow.mid b{color:var(--cyan)}
.obrow.sun{border-color:#ffb13b66}.obrow.sun b{color:var(--sun)}
.obg{flex:0 0 auto;background:#03110d;border-radius:12px}
/* 계절 맞추기 */
.ssgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:900px){.ssgrid{grid-template-columns:1fr 1fr}}
.sscard{border:2px solid var(--line2);border-radius:18px;padding:10px;background:#04140f}
.sscard.ok{border-color:var(--green)}
.sscard h4{margin:0 0 4px;font-family:var(--disp);font-size:1.4rem;color:var(--sun)}
.ssbtn{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.ssbtn button{min-height:44px;padding:4px;background:var(--panel2);border:1.5px solid var(--line2);font-weight:700}
.ssbtn button.no{border-color:var(--red);opacity:.6}
/* 달 위상 */
.phview{display:flex;gap:16px;align-items:center;background:#04140f;border:1.5px solid var(--line);border-radius:20px;padding:12px 16px}
.phview>div:first-child{flex:0 0 auto;width:170px}
.phname{font-family:var(--disp);font-size:1.9rem;color:var(--sun);line-height:1.3}
.phstrip{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:12px}
.phstrip button{min-height:0;padding:4px;background:#000;border:2px solid transparent;border-radius:10px}
.phstrip button.on{border-color:var(--sun)}
.phstrip img{width:100%;display:block}
@media (max-width:600px){.phview{flex-direction:column}}
.pgcount{display:flex;gap:6px;align-items:center;margin:4px 0 10px}
.pgcount i{width:26px;height:10px;border-radius:9px;background:#1f5247}.pgcount i.on{background:var(--green)}
.pggrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pggrid button{min-height:0;padding:6px;background:#000;border:2px solid var(--line2);border-radius:14px}
.pggrid button.no{border-color:var(--red);opacity:.5}
.pggrid img{width:100%;display:block}
/* 그림자 */
.ecstate{background:#04140f;border:1.5px solid var(--line);border-radius:18px;padding:12px 16px;min-height:112px}
.ech{font-family:var(--disp);font-size:1.6rem;color:var(--sun)}
.ecviews{display:flex;gap:12px;justify-content:center;margin-top:10px;text-align:center;flex-wrap:wrap}
.ecviews>div{background:#03110d;border:1.5px solid var(--line);border-radius:16px;padding:8px 12px}
/* 천재(정) 탐구 도우미 */
.dpin{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:6px}
.dpin label{display:flex;align-items:center;gap:6px;font-size:.98rem}
.dpin input{width:84px;min-height:44px;padding:6px 10px;font-size:1.15rem;text-align:center}
.trbtn.arw{grid-template-columns:repeat(6,1fr)}.trbtn.arw button{font-size:1.25rem;padding:0}
.arwover{position:absolute;right:10px;top:8px;font-size:2.6rem;line-height:1;color:#ffd166;text-shadow:0 2px 10px #000}
.dirbtn button.no{border-color:var(--red);color:var(--red)}
table.sstab td.y{background:#3fe6a622}table.sstab td.n{background:#ff6b6b22}
table.sstab select{min-height:44px;padding:6px 8px;font-size:1rem}
.ovstage{position:relative;width:100%;max-width:820px;margin-left:auto;margin-right:auto;background:#03110d;border:1.5px solid var(--line);border-radius:16px;overflow:hidden;touch-action:none;user-select:none}
.ovcard{position:absolute;border:2.5px solid;border-radius:12px;background:rgba(30,60,140,.22);cursor:grab;touch-action:none;transition:box-shadow .2s}
.ovcard.drag{cursor:grabbing;box-shadow:0 14px 34px #000c}
.ovcard.ok{box-shadow:0 0 0 3px var(--green),0 0 24px #3fe6a655}
.ovarrow{position:absolute;inset:0;pointer-events:none;z-index:999}
.spin3dbox{padding:8px}
.spinctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.spinctl>.btn-p{flex:0 0 auto;min-height:46px}
.vidlink{display:block;position:relative;background-size:cover;background-position:center;text-decoration:none}.vidlink span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:76px;height:54px;border-radius:14px;background:#e00;color:#fff;font-size:1.7rem;display:grid;place-items:center}.vidlink em{position:absolute;left:0;right:0;bottom:0;padding:8px 12px;background:#000b;color:#fff;font-style:normal;font-weight:700}

.dkov{position:fixed;inset:0;z-index:9999;background:#03050ef2;display:flex;flex-direction:column}
.dktop{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 8px;flex-wrap:wrap}
.dktop button{min-height:44px;padding:6px 14px}
.dkttl{font-family:var(--disp);color:var(--mut);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dknum{color:var(--cyan);font-weight:700;font-variant-numeric:tabular-nums}
.dkbody{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;padding:0 8px}
.dkbody img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px;box-shadow:0 10px 40px #000a;cursor:pointer;user-select:none}
.dkarw{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:72px;border-radius:14px;background:#0b1330cc;border:1.5px solid var(--line);color:#fff;font-size:1.4rem;z-index:2;cursor:pointer}
.dkarw.l{left:12px}.dkarw.r{right:12px}
.dkthumbs{display:flex;gap:8px;overflow-x:auto;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.dkthumbs img{height:62px;aspect-ratio:16/9;border-radius:6px;opacity:.5;border:2px solid transparent;cursor:pointer;flex:none}
.dkthumbs img.on{opacity:1;border-color:var(--cyan)}
.dkov:fullscreen .dktop,.dkov:fullscreen .dkthumbs{display:none}.dkov:fullscreen .dkbody{padding:0}.dkov:fullscreen .dkbody img{border-radius:0;box-shadow:none}
.dkov:fullscreen .dkarw{opacity:.25}.dkov:fullscreen .dkarw:hover{opacity:1}
.dkmini{display:inline-block;margin:6px 0 2px;padding:4px 12px;border-radius:999px;border:1.5px solid var(--cyan);color:var(--cyan);font-size:.9rem;background:#03130fcc;cursor:pointer}
.dkmini:hover{background:#0b2238}
.stg-top .dkbtn{white-space:nowrap}
@media (max-width:700px){.stg-top .dkbtn{font-size:.8rem;padding:2px 8px}.dkarw{width:40px;height:56px}.dkthumbs img{height:44px}}
/* 시즌2 테마: 심해 청록 — 입장 화면 별궤적 사진을 청록빛으로 */
#gate{background-image:radial-gradient(900px 600px at 70% 20%,#0f6b5a66,transparent 60%),linear-gradient(#0b6b5a,#06303a),url(img/trail_n.jpg)!important;background-blend-mode:normal,color,normal!important}
.gatebox{border-color:#2f7a68!important}
.chapw{display:flex;flex-direction:column;gap:8px}
.chapw>.chap{flex:1}
.dkunder{width:100%;min-height:44px;padding:8px 12px;border-radius:14px;border:1.5px solid var(--cyan);color:var(--cyan);background:#03130fcc;font-size:.95rem;font-weight:700;cursor:pointer}
.dkunder:hover{background:#0b2a24}
.bdcard{text-align:center;border:1.5px solid var(--line2);border-radius:22px;padding:22px 16px;background:radial-gradient(circle at 50% 35%,#0f6b5a55,transparent 70%),var(--panel)}
.bdcard.empty{padding:48px 16px;color:var(--mut)}
.bdicon{font-size:2.4rem;color:var(--sun);line-height:1}
.bdname{font-family:var(--disp);font-size:clamp(1.8rem,3.4vw,2.6rem);color:var(--sun);margin-top:4px}
.wopt.on{border-color:var(--cyan);background:#0b2a24}
.bdrev p{font-size:1.02rem}
.refbox{margin-top:14px;font-size:.98rem}
.refbox summary{cursor:pointer;font-weight:800;color:var(--cyan);list-style:none}
.refbox summary::-webkit-details-marker{display:none}
.refbox summary::after{content:" ▾ 펼쳐 보기";font-weight:400;color:var(--mut);font-size:.9rem}
.refbox[open] summary::after{content:" ▴ 접기"}
.refbox p{margin:10px 0 0;line-height:1.7}
.actpre{margin:6px 0 14px;font-size:.98rem;line-height:1.7}
.actpre ol{margin:6px 0 0;padding-left:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(440px,1fr));column-gap:28px}
.cmdel{float:right;background:none;border:1px solid var(--line);border-radius:8px;color:var(--mut);font-size:.8rem;padding:2px 8px;cursor:pointer;min-height:28px}.cmdel:hover{color:#ff8f8f;border-color:#ff8f8f}
.mcal{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.mcell{position:relative;text-align:left;background:#ffffff08;border:1.5px solid var(--line);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:4px;min-height:0;color:var(--fg);font-size:.8rem}
.mcell.has{border-color:#5fd4e680;background:#5fd4e60f}.mcell.sel{border-color:var(--sun);box-shadow:0 0 0 2px #ffb13b55}.mcell.today .md b{color:var(--sun)}
.mcell .md{display:flex;justify-content:space-between;gap:2px;color:var(--mut);white-space:nowrap;overflow:hidden}.mcell .md b{color:var(--fg)}.mcell .md i{font-style:normal;color:var(--sun);font-weight:700;font-size:.72rem}
.mcell .ml{color:var(--mut);font-size:.72rem;white-space:nowrap}
.mcell .mph{aspect-ratio:1;border-radius:8px;overflow:hidden;background:#02070c;display:grid;place-items:center;position:relative}
.mcell .mph.g{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:1px;place-items:stretch}
.mcell .mph img{width:100%;height:100%;object-fit:cover;display:block}.mcell .mph svg{width:62%;opacity:.3}
.mcell .mn{position:absolute;right:4px;bottom:4px;background:var(--sun);color:#1b1200;font-size:.72rem;font-weight:700;border-radius:99px;padding:0 6px}
.mdet{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:10px}
.mcard{display:flex;flex-direction:column;gap:6px;background:#ffffff08;border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.mpair{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mpair>div{display:flex;flex-direction:column;gap:3px;text-align:center;font-size:.78rem;color:var(--mut)}
.mpair img,.mpair .mc{width:100%;aspect-ratio:1;border-radius:8px;object-fit:cover;background:#02070c;display:grid;place-items:center}.mpair .mc svg{width:70%}
.mvote{display:flex;gap:6px}.mvote button{flex:1;min-height:36px;font-size:.85rem;background:#ffffff0d;border:1px solid var(--line);border-radius:8px;padding:4px;color:var(--fg)}.mvote button.on{border-color:var(--ok,#7be0a1);color:var(--ok,#7be0a1)}
.mgal{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.mgi{background:#ffffff08;border:1px solid var(--line);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:3px;text-align:left;color:var(--fg);font-size:.8rem;min-height:0}.mgi img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
.mup{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}@media(max-width:720px){.mup{grid-template-columns:1fr}}
.mup label{display:flex;flex-direction:column;gap:3px;font-size:.88rem;color:var(--mut)}
.mup input[type=text],.mup input[type=datetime-local],.mup select{font:inherit;color:var(--fg);background:#02070c;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
@media(max-width:560px){.mcal{grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.mcell{padding:4px;font-size:.66rem}.mcell .md i{display:none}}
#mCrop{width:100%;max-width:340px;aspect-ratio:1;border-radius:12px;background:#02070c;touch-action:none;cursor:grab;display:block}
/* 시험 연습 (정기시험 형식) */
.xpaper{color-scheme:light;background:#fdfbf4;color:#1a1a1a;border-radius:16px;padding:18px 20px;box-shadow:inset 0 0 0 1px #d8d2bc;line-height:1.7;font-size:1.05rem;margin-top:6px}
.xhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:2px solid #1a1a1a;padding-bottom:8px;margin-bottom:6px;font-size:1.05rem}
.xcols{columns:2 520px;column-gap:34px;column-rule:1px solid #cfc7ad}
.xq{break-inside:avoid;padding:14px 2px 18px;border-bottom:1px dashed #cfc7ad}
.xtop{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:30px}
.xtopic{font-size:.8rem;color:#6b5d3a;border:1px solid #cfc7ad;border-radius:99px;padding:1px 10px}
.xtry{font-size:.8rem;color:#8a4b00}
.xstem{margin:6px 0}.xstem .qn{margin-right:6px;font-size:1.1rem}.xq2{margin:8px 0 4px}.xp{color:#555;font-size:.95rem}

.xrow{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}.xcell{display:flex;flex-direction:column;align-items:center;gap:4px;width:150px;max-width:44%}
.xcell img,.xcell svg{width:100%;height:auto;aspect-ratio:1;object-fit:contain;border-radius:6px;background:#0b0b0b}
.xbogi{border:1.5px solid #333;border-radius:6px;padding:16px 14px 8px;margin:16px 0 10px;position:relative}
.xbogi>.lb{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:#fdfbf4;padding:0 12px;font-weight:700;letter-spacing:.2em}
.xbl{display:flex;gap:8px;align-items:center;margin:4px 0}.xbl .t{flex:1}
.xpaper button{font-size:1rem;min-height:40px;color:#1a1a1a}
.xox{display:flex;gap:4px;flex:0 0 auto}
.xox button{min-height:38px;min-width:42px;padding:0 8px;border-radius:8px;border:1.5px solid #b9b19a;background:#fff;color:#777;font-weight:900}
.xox button.o.on{background:#1f7a4d;color:#fff;border-color:#1f7a4d}.xox button.x.on{background:#b3261e;color:#fff;border-color:#b3261e}
.xjudge{flex:0 0 auto;font-weight:900;font-size:1.1rem;padding:0 8px}.xjudge.o{color:#1f7a4d}.xjudge.x{color:#b3261e}
.xwhy{font-size:.92rem;color:#3d3420;background:#f4eedc;border-radius:8px;padding:6px 10px;margin:2px 0 8px}
.xopts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.xopts.col{flex-direction:column;flex-wrap:nowrap}
.xorow{display:flex;gap:6px;align-items:stretch}.xorow .xopt{flex:1;text-align:left}
.xopt{padding:6px 14px;border-radius:10px;border:1.5px solid #b9b19a;background:#fff;transition:opacity .2s}
.xopt.cut{text-decoration:line-through;opacity:.35}.xopt.no{border-color:#b3261e;background:#fbe9e7}
.xopt.ok,.xopt.ok:disabled{border-color:#1f7a4d;background:#e3f4ea;font-weight:700;opacity:1}
.xstrike{flex:0 0 auto;min-width:42px;padding:0 8px;border-radius:10px;border:1.5px dashed #b9b19a;background:transparent;color:#999}.xstrike.on{border-style:solid;border-color:#b3261e;color:#b3261e}
.xtbl{border-collapse:collapse;margin:8px auto;font-size:.98rem}.xtbl th,.xtbl td{border:1px solid #555;padding:5px 10px;text-align:center}.xtbl th{background:#efe9d6}
.xtbl.pick td:first-child,.xtbl.pick th:first-child,.xtbl.pick .xs{border:0;background:transparent;padding:3px}
.xtbl .xnum{min-width:44px;padding:0 8px}.xtbl tr.cut td:not(.xs){text-decoration:line-through;opacity:.35}.xtbl tr.ok td{font-weight:700;color:#1f7a4d}
.xfb{margin-top:10px;border-radius:12px;padding:10px 14px;font-size:1rem}.xfb.ok{background:#e3f4ea;border:1.5px solid #1f7a4d}.xfb.no{background:#fff4e0;border:1.5px solid #c77700}
.xpaper .small{color:#6b5d3a}.xpaper .stamp{color:#1f7a4d;border-color:#1f7a4d;background:#e3f4ea}
.xwide{overflow-x:auto;-webkit-overflow-scrolling:touch}.xwide svg{min-width:560px}
@media(max-width:600px){.xwide::after{content:"← 그림을 옆으로 밀어 볼 수 있어요 →";display:block;text-align:center;font-size:.8rem;color:#6b5d3a}}
@media(max-width:430px){nav#tabs{padding-left:2px;padding-right:2px}nav#tabs button{flex:1 1 0;min-width:0;font-size:.6rem;white-space:nowrap;letter-spacing:-.06em;padding:6px 0;overflow:hidden}nav#tabs button .ic{font-size:1.15rem}}
.xgrp{margin:6px 0;line-height:1.7}.xgrpbox{break-inside:avoid;padding-top:12px}
.xpaper.one{max-width:880px;margin:8px auto 0}
.xw{cursor:pointer;border-radius:4px;transition:background .15s}.xw:hover{background:#f1e7c6}
.xw.xk.on,mark.xhl{background:#ffe76a;color:#1a1a1a;border-radius:4px;padding:0 2px;box-shadow:0 2px 0 #c9a800}
.xw.miss{background:#f6d5d1;text-decoration:line-through}
.xstage{margin:14px 0 6px;padding:8px 12px;border-left:5px solid #8a4b00;background:#f4eedc;border-radius:6px;font-size:1rem}.xstage .small{color:#6b5d3a}
.xstage.s1{border-color:#c9a800;background:#fff7cf}
.xkl{margin:8px 0 0;padding-left:20px;font-size:.95rem}.xkl li{margin:3px 0}
.xknotes{margin:10px 0;font-size:.95rem}.xknotes summary{cursor:pointer;color:#6b5d3a}
.xshow{margin-left:8px;min-height:34px;padding:2px 12px;border-radius:8px;border:1.5px solid #c9a800;background:#fff}
.xopt:disabled{cursor:default}.xopt:disabled:not(.ok):not(.bad){opacity:.45}
.xopt.sel{border-color:#1a1a1a;background:#1a1a1a;color:#fff;font-weight:700}
.xopt.bad,.xopt.bad:disabled{border-color:#b3261e;background:#fbe9e7;opacity:1;text-decoration:line-through}
.xres{font-weight:900}.xres.o{color:#1f7a4d}.xres.x{color:#b3261e}
.xmodes{display:flex;gap:10px;flex-wrap:wrap;margin:0 4px 10px}.xmodes button{flex:1 1 260px;background:var(--panel2);border:1.5px solid var(--line2);display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.xmodes button.on{border-color:var(--sun);box-shadow:0 0 0 2px #ffb13b55;font-weight:800}
.xdots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:4px 0 8px}
.xdots button{min-height:40px;min-width:40px;padding:0;border-radius:50%;background:#ffffff10;border:1.5px solid var(--line2);font-weight:700}
.xdots button.ok{background:#1f7a4d;border-color:#3fe6a6;color:#fff}.xdots button.cur{box-shadow:0 0 0 3px var(--sun)}
.xnav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}.xnav button{min-height:48px}
.xbar{display:flex;justify-content:space-between;gap:10px;font-size:1.05rem;margin-top:6px}
.xtr{position:relative;width:100%;aspect-ratio:1;border-radius:6px;overflow:hidden;background:#000}.xtr img{width:100%;height:100%;object-fit:cover;object-position:center 70%;border-radius:0}.xtr svg{position:absolute;inset:0;width:100%;height:100%;background:none!important;aspect-ratio:auto}
.xta{width:100%;min-height:96px;margin:6px 0;background:#fff;color:#1a1a1a;border:1.5px solid #b9b19a;border-radius:10px;padding:10px 12px;font:inherit;font-size:1rem;line-height:1.6}
.xta[readonly]{background:#f4eedc}
.xpick{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0}.xpick label{display:flex;gap:6px;align-items:center;color:#1a1a1a}
.xpick select{font:inherit;color:#1a1a1a;background:#fff;border:1.5px solid #b9b19a;border-radius:8px;padding:6px 10px;width:auto}
.xck{list-style:none;padding:0;margin:6px 0 0}.xck li{padding:2px 0}.xck .y::before{content:"✔ ";color:#1f7a4d}.xck .n::before{content:"✦ ";color:#c77700}
.xrub{width:100%}.xrub input{width:24px;height:24px;-webkit-appearance:checkbox;appearance:auto;accent-color:#1f7a4d;background:#fff;min-height:0;padding:0;margin:0;cursor:pointer}
.xpaper .fb{color:var(--fg)}
.xprog{display:grid;gap:6px;margin-top:8px}.xprog>div{display:flex;justify-content:space-between;align-items:center}
@media(max-width:560px){.xpaper{padding:12px 10px;font-size:1rem}.xcols{columns:1}.xopt{padding:4px 10px}.xox button{min-width:38px}}
</style>
</head>
<body class="gate">
<div id="gate"></div>
<div id="app" class="wrap"></div>
<div id="stage" hidden></div>

  <button data-v="home"><span class="ic">🛰️</span>관제센터</button>
  <button data-v="crew"><span class="ic">🧑‍🚀</span>승무원실</button>

  <button data-v="obs"><span class="ic">🔍</span>관측 추리</button>
  <button data-v="exam"><span class="ic">📝</span>시험 연습</button>
  <button data-v="moon"><span class="ic">🌙</span>달 앨범</button>
  <button data-v="comms"><span class="ic">📡</span>교신</button>

</nav>

const API = 'https://script.google.com/macros/s/AKfycbxNm28yoKc0w33ZKzgVZspQVUxzagBU1oewJEIJef4qILhxR93avtzHD3llbvumzJlaBA/exec';

let seq=0;
function call(params){ return new Promise((done,fail)=>{
  if(me&&me.guest&&params.action!=="qlist"&&params.action!=="moonList") return fail(GUEST_MSG);

  const cb='cb_'+(++seq)+'_'+Date.now(); let s;
  const timer=setTimeout(()=>{clean();fail('시간 초과');},20000);
  function clean(){clearTimeout(timer);try{delete window[cb];}catch(e){window[cb]=undefined;} if(s&&s.parentNode)s.parentNode.removeChild(s);}

function applyAdj(list){

  (spec.groups||[]).forEach(g=>{need++;const hit=g.words.some(w=>t.includes(w));
    if(hit){got++;msgs.push({y:1,m:`핵심어 포함: ${g.name}`});}else msgs.push({y:0,m:`이 내용이 보이지 않아요 → ${g.name}`});});
  if(spec.compare){need++;if(COMPARE.test(t)){got++;msgs.push({y:1,m:"비교 표현 사용 (…보다, 반면 등)"});}else msgs.push({y:0,m:"두 대상을 '…보다/반면'처럼 직접 비교해 보세요"});}
  if(spec.link!==false){need++;if(LINKS.test(t)){got++;msgs.push({y:1,m:"이유·결론 연결어 사용 (때문에, 따라서 등)"});}else msgs.push({y:0,m:"'왜냐하면 ~ 때문이다', '따라서 ~'로 근거와 주장을 이어 보세요"});}

}

function phaseShadowPath(r,alpha){
 alpha=wrap360(alpha); const wax=alpha<=180; const a=wax?alpha:360-alpha;
 const c=Math.cos(a*D2R), rx=Math.abs(r*c).toFixed(2);

 const d=`M0 ${-r} A${r} ${r} 0 0 0 0 ${r} A${rx} ${r} 0 0 ${c>0?0:1} 0 ${-r} Z`;
 return {d, flip:!wax};
}

 {t:"learn",h:"황도와 황도 12궁",b:`<p>밤하늘 전체는 국제천문연맹(IAU)이 정한 <span style="color:var(--sun);font-weight:800">88개</span>의 별자리로 나뉘어 있어요. 그중 몇 개가 태양이 지나가는 길 위에 놓여 있을까요?</p><p>태양이 연주 운동하면서 별자리 사이로 지나가는 길을 <b>황도</b>, 황도 부근의 12개 대표 별자리를 <b>황도 12궁</b>이라고 해요.</p><p>태양 근처에 있는 별자리는 태양과 함께 뜨고 지므로 <em>볼 수 없어요</em>. 반면에 <b>태양 반대쪽</b>에 있는 별자리는 한밤중에 남쪽 하늘에서 볼 수 있어요.</p><div class="key"><span class="kt">알쏭달쏭 · 태양 반대쪽 별자리는 언제 볼까?</span>해가 진 직후 <b>동쪽</b>에서 보이기 시작해 → 한밤중 <b>남쪽</b> 하늘에서 가장 높이 → 해 뜰 무렵 <b>서쪽</b>으로 진다.</div><div class="bdreveal"></div><details class="frame refbox"><summary>📎 참고 자료 — "13번째 별자리 발견, 이제 황도 13궁?" 뉴스는 사실일까?</summary><p>2016년 미국 항공우주국(NASA)의 어린이용 누리집 글이 퍼지면서 “13번째 별자리 <span style="color:var(--sun)">뱀주인자리</span>가 발견됐다, 별자리 운세가 바뀐다”는 뉴스가 여러 번 나왔어요. 하지만 <span style="color:var(--sun)">새로 발견된 별자리는 아니에요.</span></p><p>1928년 국제천문연맹이 88개 별자리의 경계를 정해 보니, 태양이 지나가는 길(황도)이 전갈자리와 궁수자리 사이에서 <span style="color:var(--sun)">뱀주인자리</span>도 지나가요. 태양은 해마다 11월 말~12월 중순(약 18일) 뱀주인자리 앞을 지나요. 약 3000년 전 바빌로니아 사람들이 1년 열두 달에 맞추어 12개만 골랐기 때문에 ‘12궁’이 된 거예요.</p><p>NASA도 2020년에 “우리는 별자리를 바꾸지 않았다”고 밝혔어요. 그래서 과학 교과서에서는 지금도 <span style="color:var(--sun)">황도 12궁</span>이라고 불러요. 태양이 실제로 지나가는 별자리는 13개라는 것, 그것이 정확한 사실이에요.</p><p class="small">출처: 한국천문연구원 천문우주지식정보 「뱀주인자리」(황도가 지나지만 황도 12궁에는 포함되지 않음) · 한국천문연구원 「별자리의 역사」(1928년 88개 확정) · CBS News, 2020.7.17 “No, NASA has not discovered a new zodiac sign”</p></details>`,art:"orbitMini"},
 {t:"quiz",art:"orbitQ3",q:"그림에서 <b>3월</b>의 지구를 찾아보자. 3월 한밤중에 남쪽 하늘에서 볼 수 있는 별자리는?",o:["물병자리","사자자리","물고기자리"],a:1,ex:"3월 지구에서 태양 쪽을 보면 물병자리(낮이라 안 보임), 그 반대쪽 — 지구의 밤인 쪽으로 쭉 나가면 사자자리. 한밤중 남쪽 하늘에는 태양 반대쪽 별자리가 보여요."},
 {t:"quiz",q:"태양의 연주 운동 방향과 그 까닭으로 옳은 것은?",o:["동→서, 지구의 자전 때문","서→동, 지구의 공전 때문","동→서, 지구의 공전 때문"],a:1,ex:"연주 운동은 지구가 1년에 한 바퀴 공전하기 때문에 나타나며, 태양은 별자리 사이를 서→동으로 이동해요."},
 {t:"quiz",q:"해 뜨기 직전 동쪽 하늘에 시리우스가 처음 보이는 날이 <b>일 년에 한 번</b> 오는 까닭은?",o:["시리우스가 일 년에 한 번 지구에 다가와서","지구가 일 년에 한 바퀴 공전해, 태양이 별자리 사이를 돌아 일 년 만에 같은 자리로 오기 때문","태양이 일 년에 한 번 자전하기 때문"],a:1,ex:"태양의 연주 운동! 태양은 1년에 한 바퀴 별자리 사이를 돌아요. 태양이 시리우스 근처를 막 지나간 뒤 새벽에 시리우스가 다시 보이기 시작하는 날도 1년에 한 번, 해마다 거의 같은 무렵이에요 — 그때가 마침 나일강이 넘치는 계절이었어요."},
 {t:"write",key:"r_c2",h:"관측 보고 · 한두 문장",img:"stars",prompt:`지구에서 관측할 때 별자리가 <b>1년을 주기로</b> 변하는 까닭은 무엇일까요? 한두 문장으로 보고하세요.`,frame:"지구가 태양 주위를 <b>1년</b>에 한 바퀴씩 ___하면서 태양이 보이는 위치가 달라지고, 태양 ___쪽 별자리도 달라지기 때문이다.",
  spec:{min:25,groups:[{name:"'공전'",words:["공전"]},{name:"1년(일 년)",words:["1년","일 년","일년","한 해"]},{name:"태양의 위치 또는 태양 반대쪽 별자리",words:["반대","태양이 보이는","태양의 위치","태양 위치"]}]},
  ai:"[관측 보고 ② 별자리의 1년 주기] 정답 요소: (1) 지구가 태양 주위를 1년에 한 바퀴 공전한다 (2) 그래서 태양이 보이는 위치(별자리 사이의 위치)가 달라진다 (3) 태양 반대쪽(한밤중에 보이는) 별자리도 달라져 1년 주기로 변한다. 상=세 요소 / 중=공전과 1년은 썼으나 태양 위치·반대쪽 연결이 없음 / 하=자전 때문이라고 쓰거나(오개념) 공전 언급 없음."},

]},

 {t:"learn",h:"창의·융합 · 달 탐사선 다누리",figs:[["danuri_launch","2022년 8월 5일 발사된 <b>다누리</b>"],["danuri_earth","다누리가 달 궤도에서 본 <b>지구</b>"]],b:`<p>우리나라 최초의 달 탐사선 <b>다누리</b>는 2022년 8월 5일 발사되어 12월 27일 달 궤도에 진입했어요. 우리나라는 세계 <em>7번째</em> 달 탐사국이 되었죠.</p><p>다누리가 보내온 지구 사진을 날짜순으로 늘어놓으면 — <b>지구도 달처럼 위상이 변해요!</b> 다누리에서 보면 태양·달·지구의 위치가 계속 바뀌기 때문이에요.</p><div class="key"><span class="kt">생각 더하기</span>달에서 '보름달'처럼 동그란 지구가 보일 때, 지구에서 본 달은 어떤 모양일까? (힌트: 그때 달은 지구와 태양 사이)</div>`},

 {t:"learn",h:"교실 활동 · 오레오로 만드는 달의 위상",wide:true,b:`<div class="frame"><b style="color:var(--sun)">🍪 이렇게 해요</b><ol style="margin:8px 0 0;padding-left:22px;line-height:1.8">

{t:"write",key:"r_c3",h:"관측 보고 · 한두 문장",img:"cov_moon",prompt:`"내가 변신하는 게 아니야." — 달의 위상이 <b>약 한 달 주기</b>로 반복되는 까닭을 태양·지구·달의 위치와 관련지어 한두 문장으로 보고하세요.`,frame:"달이 지구 주위를 약 <b>한 달</b>에 한 바퀴씩 ___하면서 태양, 지구, 달의 상대적 ___가 달라지고, 지구에서 볼 때 ___이/가 비치는 부분이 달라지기 때문이다.",
  spec:{min:25,groups:[{name:"달의 '공전'",words:["공전"]},{name:"태양·지구·달의 위치(배열)",words:["위치","배열"]},{name:"햇빛이 비치는(밝은) 부분",words:["햇빛","밝은","비치"]}]},
  ai:"[관측 보고 ③ 위상 변화의 주기] 정답 요소: (1) 달이 지구 주위를 약 한 달에 한 바퀴 공전한다 (2) 태양·지구·달의 상대적 위치가 달라진다 (3) 지구에서 볼 때 햇빛이 비치는(밝게 보이는) 부분이 달라져 모양이 변한다 / 달은 스스로 빛을 내지 못하고 햇빛을 반사한다. 상=세 요소 / 중=두 요소 / 하=지구 그림자가 달을 가려서라고 씀(월식과 혼동하는 대표 오개념 — 반드시 먼저 짚을 것) 또는 달이 스스로 빛난다고 씀."},
 {t:"clear",vids:[2],pts:["달은 햇빛을 반사 — 공전하면서 햇빛이 비치는 부분이 달라져 보인다","북극 하늘에서 보면 달은 지구 주위를 시계 반대 방향으로, 약 한 달 주기로 공전","삭(1일경) → 초승달 → 상현(7~8일경, 오른쪽이 둥근 반달) → 망(15일경) → 하현(22~23일경, 왼쪽이 둥근 반달) → 그믐달","지구에서 보이는 반쪽 ∩ 햇빛 받는 반쪽 = 우리가 보는 밝은 부분","다누리에서 보면 지구도 위상이 변한다"]}
]},
{id:"c4",cover:"cov_ecl",title:"가려지는 태양, 그림자 속의 달",no:"MISSION 04",sub:"일식과 월식 · 256~259쪽",slides:[
 {t:"hero",log:"통신 로그 · S2-D60 · 숨바꼭질 작전",h:"가려지거나, 그림자 속에 숨거나",sub:"숨바꼭질 — 한 아이는 소파 뒤에 숨고(가려짐), 한 아이는 깜깜한 곳에 숨었다(그림자 속). 하늘에서도 똑같은 일이 벌어진다. 태양이 가려지는 날과, 달이 그림자 속에 숨는 밤 — 둘의 정체를 밝혀라. — 센터장",scene:"eclHero"},
 {t:"learn",h:"일식",figs:[["ecl_tsolar.png","<b>개기 일식</b> — 태양이 달에 완전히 가려짐"],["ecl_psolar.png","<b>부분 일식</b> — 태양의 일부분이 가려짐"]],b:`<p>달이 태양의 일부 또는 전체를 가려서 보이지 않게 되는 현상을 <b>일식</b>이라고 해요.</p><p>일식은 <b>태양, 달, 지구</b> 순으로 일직선상에 놓이는 <em>삭</em>일 때 일어나요.</p><ul><li>태양이 달에 의해 완전히 가려짐 → <b>개기 일식</b></li><li>태양의 일부분이 가려짐 → <b>부분 일식</b></li></ul>`},
 {t:"learn",h:"그림자에도 짙은 곳과 옅은 곳이 있다",art:SHADOW_FIG,b:`<p>교실 형광등 아래에서 공을 들고 바닥의 그림자를 보면, 가운데는 진하고 가장자리는 흐려요. 형광등처럼 <span style="color:var(--sun)">빛이 나오는 곳이 넓기</span> 때문이에요.</p><ul><li>A — <b>짙은 그림자</b>: 바닥에서 올려다보면 형광등이 공에 <span style="color:var(--sun)">완전히</span> 가려져요.</li><li>B — <b>옅은 그림자</b>: 형광등이 <span style="color:var(--sun)">일부만</span> 가려져요.</li><li>C — 그림자 밖: 형광등이 다 보여요.</li></ul><div class="key"><span class="kt">일식과 연결</span>형광등 → <em>태양</em>, 공 → <em>달</em>, 바닥 → 지구 표면. 짙은 그림자를 <span style="color:var(--sun)">본그림자</span>, 옅은 그림자를 <span style="color:var(--cyan)">반그림자</span>라고 불러요.</div><div class="frame">🔦 <b style="color:var(--violet)">교실에서 해 보기</b> — 형광등 아래 책상 위에 주먹을 들고, 그림자의 진한 곳과 흐린 곳에 눈을 대고 형광등을 올려다보세요.</div>`},
 {t:"learn",h:"일식은 어디서 볼 수 있을까?",art:ECL_SOLAR_FIG,b:`<p>일식은 <b>달의 그림자</b>가 지구에 드리워진 지역에서만 볼 수 있어요. <span class="small">(교과서 그림 19)</span></p><ul><li>달의 <span style="color:var(--sun)">본그림자(짙은 그림자)</span> 속 — 아주 좁은 지역 → <b>개기 일식</b></li><li>그 둘레 <span style="color:var(--cyan)">반그림자(옅은 그림자)</span> 속 — 더 넓은 지역 → <b>부분 일식</b></li><li>달의 그림자 밖 → 일식이 보이지 않아요 (낮이어도 태양이 그대로)</li></ul><div class="key"><span class="kt">핵심</span>같은 날 일어난 일식이라도 <em>서 있는 곳</em>에 따라 개기 일식, 부분 일식으로 다르게 보이거나 아예 보이지 않아요.</div>`},
 {t:"act",m:"umbra",h:"내가 서 있는 곳에서 태양을 올려다보면?",kick:"⚫ 본그림자 · 🌗 반그림자 · ☀️ 그림자 밖",lock:"세 곳(본그림자·반그림자·그림자 밖)에 모두 서 봐야 다음으로 갈 수 있어요"},
 {t:"learn",h:"월식",figs:[["ecl_tlunar.png","<b>개기 월식</b> — 달이 붉게 보임"],["ecl_plunar.png","<b>부분 월식</b> — 달의 일부가 어두워짐"]],b:`<p>달이 <b>지구의 그림자</b> 속에 들어가 일부 또는 전체가 보이지 않는 현상을 <b>월식</b>이라고 해요.</p><p>월식은 <b>태양, 지구, 달</b> 순으로 일직선상에 놓이는 <em>망</em>일 때 일어나요.</p><ul><li>달의 일부가 지구 그림자 속 → <b>부분 월식</b></li><li>달이 지구 그림자 속으로 완전히 → 달이 붉게 보이는 <b>개기 월식</b></li></ul>`},
 {t:"learn",h:"월식은 어디서 볼 수 있을까?",art:ECL_LUNAR_FIG,b:`<p>월식은 달이 <b>지구의 그림자</b> 속에 들어가는 현상이에요. 그래서 그 시각 지구에서 <em>밤인 지역</em> 어디서나 볼 수 있어요. <span class="small">(교과서 그림 21)</span></p><ul><li>A, C — 달의 일부만 지구 그림자 속 → <b>부분 월식</b></li><li>B — 달 전체가 지구 그림자 속 → <b>개기 월식</b> (붉은 달)</li></ul><div class="key"><span class="kt">일식과 다른 점</span>일식은 관측하는 <span style="color:var(--sun)">장소</span>에 따라 개기·부분이 달라지지만, 월식은 <span style="color:var(--violet)">달의 위치</span>에 따라 정해져요. 같은 시각이면 밤인 곳 어디서 보든 똑같은 월식이 보여요.</div>`},
 {t:"act",m:"lunarWho",h:"월식 시뮬레이터 — 달을 지구 그림자 속으로!",kick:"🔴 달을 움직이고, 나도 움직여 보기",lock:"보름달·부분 월식·개기 월식을 모두 만들고, 밤과 낮에서 모두 봐야 다음으로 갈 수 있어요"},
 {t:"learn",h:"일식 vs 월식 — 볼 수 있는 지역은 어디가 더 넓을까?",art:AREA_FIG,b:`<p>일식은 달의 그림자가 닿는 <span style="color:var(--sun)">좁은 지역</span>에서만, 월식은 <span style="color:var(--violet)">밤인 지역 어디서나</span> 볼 수 있어요.</p><p>까닭 — 달은 지구보다 훨씬 작아서 <b>달의 그림자</b>는 지구의 일부만 덮지만, 월식은 달 자체가 <b>지구의 그림자</b>에 가려지므로 달이 떠 있는 곳(밤인 지역)이면 어디서나 보이기 때문이에요.</p><div class="frame">🔍 <b style="color:var(--violet)">그래서</b> 한 장소에서는 일식보다 월식을 더 자주 볼 수 있어요. 개기 일식은 같은 장소에서 수백 년에 한 번 볼까 말까 해요.</div><div class="frame">🔭 <a href="https://astro.kasi.re.kr/index" target="_blank" rel="noopener" style="color:var(--cyan);font-weight:800;text-decoration:underline">천문우주지식정보 누리집 열기 ↗</a> — 한국천문연구원 누리집이에요. <span style="color:var(--sun)">천문학습관 → 일식</span>에서 개기 일식이 일어나는 장소와 날짜를 찾아보세요. <span class="small">(교과서 257쪽 관측 활동)</span></div>`},
 {t:"act",m:"eclipse",h:"그림자 시뮬레이터 — 삭과 망에서 무슨 일이?",kick:"🌑 교과서 그림 19·21"},
 {t:"learn",h:"관측 준비 — 개기 일식은 언제, 어디서?",b:`<p>교과서 257쪽 관측 활동 1단계 — <a href="https://astro.kasi.re.kr/index" target="_blank" rel="noopener" style="color:var(--cyan);font-weight:800;text-decoration:underline">천문우주지식정보 ↗</a>의 <span style="color:var(--sun)">천문학습관 → 일식</span>에서 개기 일식이 일어나는 장소와 일시를 조사해요.</p><ul><li><span style="color:var(--sun)">2027년 8월 2일</span> — 에스파냐 남부 · 북아프리카 · 사우디아라비아. 이집트 <span style="color:var(--sun)">룩소르</span> 부근은 개기 일식이 약 6분 넘게 이어져요.</li><li><span style="color:var(--sun)">2028년 7월 22일</span> — 오스트레일리아 · 뉴질랜드 (시드니)</li><li><span style="color:var(--sun)">2035년 9월 2일</span> — 중국 · 북한 · 일본. 평양은 개기 일식, 서울은 부분 일식!</li></ul><div class="key"><span class="kt">다음 활동</span>앱 속 천체 관측 프로그램에서 장소를 고르고, 개기 일식 2시간 전부터 시간을 흘려 보내며 관측해요. 개기 일식 장소와 바로 옆 부분 일식 장소(룩소르↔카이로, 평양↔서울)를 비교해 보세요.</div><div class="frame">🏠 집에서 더 해 보기 — <a href="https://stellarium-web.org/" target="_blank" rel="noopener" style="color:var(--cyan);font-weight:800;text-decoration:underline">스텔라리움 웹 ↗</a>에서도 같은 관측을 할 수 있어요 (왼쪽 아래 위치, 오른쪽 아래 시계).</div>`},
 {t:"act",m:"kasiObs",h:"관측 — 천체 관측 프로그램으로 개기 일식 관측하기",kick:"🔭 교과서 257쪽 관측 활동 · 실제 천체 계산"},
 {t:"act",m:"progress",h:"식의 진행 — 왜 일식은 오른쪽부터, 월식은 왼쪽부터?",kick:"🔭 교과서 탐구 257쪽 정리 · 259쪽",lock:"두 질문에 답해야 다음으로 갈 수 있어요"},
 {t:"learn",h:"개기 월식 때 달이 붉은 까닭",img:"ecl_tlunar.png",cap:"<b>개기 월식</b> — 지구 그림자 속에서도 붉게 보이는 달",b:`<p>개기 월식 때 달이 완전히 사라지지 않고 <b>붉게</b> 보이는 까닭은, 지구 <em>대기</em> 때문에 햇빛의 <b>붉은색 빛</b>만 달에 비치기 때문이에요.</p><div class="key"><span class="kt">점검 7번 함정</span>"개기 월식이 발생하면 달을 완전히 볼 수 없다" — <b>틀린</b> 말! 붉게 보여요.</div><div class="frame">🔍 <b style="color:var(--violet)">더 알아보기 · 평가 범위 밖</b> — 삭과 망마다 일식·월식이 일어나지는 않아요. 달이 지구를 도는 길이 지구가 태양을 도는 길에 대해 조금 기울어져 있어서, 대부분의 삭·망에서는 셋이 정확히 일직선이 되지 않거든요.</div>`},
 {t:"learn",h:"위상 변화 vs 부분 월식 — 무엇이 다를까?",art:"phaseVsEcl",b:`<p>둘 다 달의 일부가 어둡게 보이지만 원인이 달라요.</p><ul><li><b>위상 변화</b> — 달은 늘 절반만 햇빛을 받는데, 지구에서 그 <span style="color:var(--sun)">밝은 쪽이 일부만 보이고</span> 나머지는 햇빛이 닿지 않는 어두운 쪽이 보이는 것. 경계선은 달의 양 끝을 잇는 <em>타원 모양</em>이고, 매일 조금씩 바뀌며 한 달 내내 일어나요.</li><li><b>부분 월식</b> — 둥근 <em>지구의 그림자</em>가 달을 가리는 것. 그림자의 가장자리가 달보다 훨씬 큰 원의 일부라 <em>원 모양으로 파인</em> 듯 보이고, <b>망</b>일 때만 몇 시간 동안 일어나요.</li></ul>`},

function orbitSVG(doy,opt){
 opt=opt||{}; const W=600,C=300,R1=opt.mini?150:150,R2=262; const sunL=sunLon(doy), earthL=wrap360(sunL+180);
 const P=(L,r)=>{const a=(180-L)*D2R;return [C+r*Math.cos(a),C+r*Math.sin(a)];};
 const midZ=zodAt(earthL), sunZ=zodAt(sunL);
 let g=`<svg viewBox="0 0 ${W} ${W}" class="orbsvg" style="width:100%;display:block;touch-action:none;user-select:none">
 <defs><radialGradient id="obS" cx=".45" cy=".4"><stop offset="0" stop-color="#fff6cf"/><stop offset=".6" stop-color="#ffb13b"/><stop offset="1" stop-color="#ff7a1a"/></radialGradient>
 <radialGradient id="obE" cx=".4" cy=".35"><stop offset="0" stop-color="#9fd3ff"/><stop offset="1" stop-color="#2a63c9"/></radialGradient>
 <marker id="obA" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5fe3ff"/></marker></defs>
 <circle cx="${C}" cy="${C}" r="${R2+26}" fill="#ffffff05" stroke="#1f5247"/><circle cx="${C}" cy="${C}" r="${R2-26}" fill="none" stroke="#1f5247"/>`;
 ZOD.forEach(z=>{const [x1,y1]=P(z[1],R2-26),[x2,y2]=P(z[1],R2+26);g+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#1f5247"/>`;
  const m=zodMid(z),big=BIG4.includes(z[0]);const [x,y]=P(m,R2);const hl=opt.quiz?(big?"#e6faf4":"#6aa396"):z[0]===midZ?"#5fe3ff":z[0]===sunZ?"#ffb13b":(big?"#e6faf4":"#6aa396");
  if(big&&!opt.noGlyph)g+=glyphSVG(z[0],x,y-6,0.55,hl);
  g+=`<text x="${x.toFixed(1)}" y="${(y+(big?16:5)).toFixed(1)}" text-anchor="middle" font-size="${big?15:11.5}" font-weight="${big||hl!=="#6aa396"?800:400}" fill="${hl}">${z[0].replace("자리","")}</text>`;});
 g+=`<circle cx="${C}" cy="${C}" r="${R1}" fill="none" stroke="#2f7a68" stroke-width="1.5" stroke-dasharray="4 6"/>`;
 const MD1=[1,32,60,91,121,152,182,213,244,274,305,335]; /* 매달 1일 */
 MD1.forEach((d,m)=>{const [x,y]=P(wrap360(sunLon(d)+180),R1);const big=opt.earths&&opt.earths.includes(m+1);g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${big?5:2.5}" fill="${big?'#a497ff':'#7d74d6'}"/>`;
  if(big)g+=`<text x="${x.toFixed(1)}" y="${(y+31).toFixed(1)}" text-anchor="middle" font-size="13" font-weight="800" fill="#c9c2ff">${m+1}월 지구</text>`;
  else if(!opt.mini)g+=`<text x="${(C+(x-C)*0.84).toFixed(1)}" y="${(C+(y-C)*0.84+4).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="#b3abff" opacity=".85">${m+1}월</text>`;
  /* 교과서처럼: ○월 = 그 달에 태양이 있는(보이는) 별자리 쪽에 표시 */
  const [tx,ty]=P(sunLon(d),R2-43);const key=[3,6,9,12].includes(m+1);
  g+=`<text x="${tx.toFixed(1)}" y="${(ty+4.5).toFixed(1)}" text-anchor="middle" font-size="${key?14:12}" font-weight="800" fill="#ffb13b" opacity="${key?1:.75}">${m+1}월</text>`;
  if(big)g+=`<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><circle r="12" fill="#2a63c9"/><path d="M0 -12 A12 12 0 0 1 0 12 Z" fill="#03130f" opacity=".7" transform="rotate(${(180-wrap360(sunLon(d)+180)).toFixed(1)})"/></g>`;});
 g+=`<text x="8" y="20" font-size="13" font-weight="800" fill="#ffb13b">주황 ○월</text><text x="8" y="38" font-size="12" fill="#a3cfc4">= 그 달 태양이 있는 별자리</text><text x="8" y="58" font-size="13" font-weight="800" fill="#b3abff">보라 ○월</text><text x="8" y="76" font-size="12" fill="#a3cfc4">= 그 달 지구의 위치</text>`;
 /* 공전 방향 화살표 (시계 반대) */
 g+=`<path d="M ${C-R1*0.7} ${C-R1*0.71} A ${R1} ${R1} 0 0 0 ${C-R1*0.98} ${C-R1*0.2}" fill="none" stroke="#5fe3ff" stroke-width="2.5" marker-end="url(#obA)" opacity=".8" transform="rotate(14 ${C} ${C})"/>`;
 const [ex,ey]=P(earthL,R1), [mx,my]=P(earthL,R2-30), [sx2,sy2]=P(sunL,R2-30);
 if(!opt.quiz){g+=`<line x1="${ex.toFixed(1)}" y1="${ey.toFixed(1)}" x2="${sx2.toFixed(1)}" y2="${sy2.toFixed(1)}" stroke="#ffb13b" stroke-width="1.6" stroke-dasharray="6 5" opacity=".75"/>`;
 g+=`<line x1="${ex.toFixed(1)}" y1="${ey.toFixed(1)}" x2="${mx.toFixed(1)}" y2="${my.toFixed(1)}" stroke="#5fe3ff" stroke-width="3" marker-end="url(#obA)"/>`;}
 g+=`<circle cx="${C}" cy="${C}" r="34" fill="url(#obS)"/><text x="${C}" y="${C+5}" text-anchor="middle" font-size="15" font-weight="800" fill="#2a1500">태양</text>`;
 const ang=(180-earthL); /* 화면에서 지구 위치 각 */
 if(!opt.earths)g+=`<g transform="translate(${ex.toFixed(1)} ${ey.toFixed(1)})"><circle r="17" fill="url(#obE)"/><path d="M0 -17 A17 17 0 0 1 0 17 Z" fill="#03130f" opacity=".7" transform="rotate(${ang.toFixed(1)})"/><circle r="${opt.drag?30:0}" fill="transparent" class="ehit"/></g>`;
 if(!opt.mini)g+=`<text x="${(ex+(ex-C)*0.18).toFixed(1)}" y="${(ey+(ey-C)*0.18-24).toFixed(1)}" text-anchor="middle" font-size="13" fill="#5fe3ff" font-weight="700">한밤중</text>`;
 return g+`</svg>`;}
function zodStripSVG(doy){

 let g=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block"><rect x="0" y="22" width="${W}" height="56" rx="10" fill="#0a1033" stroke="#1f5247"/>`;

 h+=`<p class="xstem"><b class="qn">${n}.</b>${q.stem?T(q.stem):T(q.q)+` <span class="xp">[${q.pts}점]</span>`}</p>`;
 if(q.fig)h+=`<div class="xfig ${q.wide?"xwide":""}">${q.fig()}</div>`;
 if(q.stem)h+=`<p class="xq2">${T(q.q)} <span class="xp">[${q.pts}점]</span></p>`;
 return h;}

/* 문항 몸통 — mode: step(한 문제씩) · paper(실전 풀이) · review(실전 채점 결과) */
function xItemHTML(q,n,mode){
 const sv=S.exam[q.id]||{},re=mode==="step"&&XRE[q.id],done=mode==="step"&&sv.ok&&!re,rev=mode==="review",m=XMARK[q.id]||{},cut=XCUT[q.id]||{};
 const pick=mode==="paper"||rev?(XPAPER&&XPAPER.a[q.id]):undefined,showWhy=done||rev;
 let h=`<div class="xq ${done?'done':''}" id="xq_${q.id}"><div class="xtop"><span class="xtopic">${q.topic}</span>`;
 if(mode==="step")h+=re?`<span class="xtry">🔁 다시 풀기 중 (점수 없음)</span>`:done?`<span class="stamp" style="font-size:.95rem">정답! +${sv.p}</span>`:(sv.t?`<span class="xtry">${sv.t}번 시도</span>`:"");
 if(rev)h+=pick===q.ans?`<span class="xres o">○ ${q.pts}점</span>`:`<span class="xres x">✕ 0점</span>`;
 h+=`</div>`+xTextBlock(q,n,mode);
 if(mode==="step"&&!xKeysDone(q)){const k=XFOUND[q.id]?XFOUND[q.id].size:0;
  h+=`<div class="xstage s1"><b>🔎 1단계 — 조건 찾기</b> <span class="small">답을 정하는 데 꼭 필요한 말을 위 문제에서 찾아 눌러 봐 (<b>${k}/${q.keys.length}</b>)</span>
   ${(XMISS[q.id]||0)>=3?`<button class="xshow" data-q="${q.id}">남은 조건 보여 줘</button>`:""}<div id="xm_${q.id}" class="small"></div>${xKeyNotes(q)}</div><div id="xf_${q.id}"></div></div>`;return h;}
 if(mode==="step")h+=`<details class="xknotes"><summary>🔎 찾은 조건 ${q.keys.length}개 다시 보기</summary>${xKeyNotes(q,true)}</details>`;
 const judge=mode==="step"&&!done&&q.kind!=="bogi";   /* 한 문제씩: 선택지도 ①~⑤ 모두 ○/✕로 판단한 뒤에 고르기 */
 const lockOpt=mode==="step"&&!done&&(q.kind==="bogi"?XL.some(l=>!m[l]):[0,1,2,3,4].some(i=>!m[i]));
 const OX=(i)=>`<span class="xox"><button data-q="${q.id}" data-l="${i}" data-m="o" class="o ${m[i]==='o'?'on':''}" aria-label="${XNUM[i]} 맞음">○</button><button data-q="${q.id}" data-l="${i}" data-m="x" class="x ${m[i]==='x'?'on':''}" aria-label="${XNUM[i]} 틀림">✕</button></span>`;
 const STEP3=lockOpt?'<div class="xstage"><b>🎯 3단계 — 답 고르기</b> <span class="small">①~⑤를 모두 ○/✕로 판단하면 열려요</span></div>':(judge?'<div class="xstage"><b>🎯 3단계 — ○로 판단한 것을 답으로 고르기</b></div>':'');
 if(q.kind==="bogi"){
  if(mode==="step"&&!done)h+=`<div class="xstage"><b>✏️ 2단계 — ㄱ, ㄴ, ㄷ을 하나씩 읽고 ○/✕ 판단</b></div>`;
  h+=`<div class="xbogi"><span class="lb">보 기</span>${q.bogi.map((b,i)=>{const l=XL[i];
   return `<div class="xbl"><span class="t"><b>${l}.</b> ${esc(b[0])}</span>${showWhy?`<span class="xjudge ${b[1]?'o':'x'}">${b[1]?'○':'✕'}</span>`:`<span class="xox"><button data-q="${q.id}" data-l="${l}" data-m="o" class="o ${m[l]==='o'?'on':''}" aria-label="${l} 옳음">○</button><button data-q="${q.id}" data-l="${l}" data-m="x" class="x ${m[l]==='x'?'on':''}" aria-label="${l} 틀림">✕</button></span>`}</div>
    ${showWhy?`<div class="xwhy">${esc(b[2])}</div>`:""}`;}).join("")}</div>`;
  if(mode==="step"&&!done)h+=`<div class="xstage"><b>🎯 3단계 — 답 고르기</b> ${lockOpt?'<span class="small">ㄱ, ㄴ, ㄷ을 모두 ○/✕로 판단하면 열려요</span>':''}</div>`;
  h+=`<div class="xopts">${XSET[q.set].map((s,i)=>xOptBtn(q,i,`${XNUM[i]} ${s.join(", ")}`,mode,done,pick,lockOpt)).join("")}</div>`;
 } else if(q.kind==="one"){
  if(judge)h+=`<div class="xstage"><b>✏️ 2단계 — ①~⑤를 끝까지 하나씩 읽고, 옳으면 ○ 틀리면 ✕</b> <span class="small">답을 찾은 것 같아도 나머지 선택지까지 모두 판단해요</span></div>`+STEP3;
  h+=`<div class="xopts col">${q.opts.map((o,i)=>`<div class="xorow">${xOptBtn(q,i,`${XNUM[i]} ${esc(o[0])}`,mode,done,pick,lockOpt,cut[i])}${showWhy?"":judge?OX(i):`<button class="xstrike ${cut[i]?'on':''}" data-q="${q.id}" data-s="${i}" aria-label="${XNUM[i]} 지우기">✕</button>`}</div>${showWhy?`<div class="xwhy">${o[1]?'○':'✕'} ${esc(o[2])}</div>`:""}`).join("")}</div>`;
 } else if(q.kind==="pos"){
  if(judge){h+=`<div class="xstage"><b>✏️ 2단계 — 그림의 위치 ①~⑤를 하나씩 따져 보고, 맞으면 ○ 아니면 ✕</b></div>`+STEP3;
   h+=`<div class="xopts col">${[0,1,2,3,4].map(i=>`<div class="xorow">${xOptBtn(q,i,`${XNUM[i]} 위치`,mode,done,pick,lockOpt)}${OX(i)}</div>`).join("")}</div>`;}
  else h+=`<div class="xopts">${[0,1,2,3,4].map(i=>xOptBtn(q,i,XNUM[i],mode,done,pick,false,cut[i])).join("")}</div>`;
  if(showWhy)h+=`<div class="xwhy">${esc(q.why)}</div>`;
 } else {
  if(judge)h+=`<div class="xstage"><b>✏️ 2단계 — ①~⑤ 줄을 하나씩 확인하고, 모두 맞으면 ○ 하나라도 틀리면 ✕</b></div>`+STEP3;
  h+=`<table class="xtbl pick"><tr><th></th>${q.head.map(x=>`<th>${x}</th>`).join("")}${showWhy?"":'<th class="xs"></th>'}</tr>${q.rows.map((r,i)=>`<tr class="${(showWhy&&i===q.ans)?'ok':''} ${!showWhy&&cut[i]?'cut':''}"><td>${xOptBtn(q,i,XNUM[i],mode,done,pick,lockOpt,false,"xnum")}</td>${r.map(c=>`<td>${esc(c)}</td>`).join("")}${showWhy?"":judge?`<td class="xs">${OX(i)}</td>`:`<td class="xs"><button class="xstrike ${cut[i]?'on':''}" data-q="${q.id}" data-s="${i}" aria-label="${XNUM[i]} 지우기">✕</button></td>`}</tr>`).join("")}</table>`;
  if(showWhy)h+=`<div class="xwhy">${esc(q.why)}</div>`;
 }
 if(rev&&pick!==q.ans)h+=`<div class="xfb no">내 답: ${pick==null?'(고르지 않음)':XNUM[pick]+' '+esc(xOptLabel(q,pick))} → 정답: ${XNUM[q.ans]} ${esc(xOptLabel(q,q.ans))}</div>`;
 h+=`<div id="xf_${q.id}"></div></div>`;return h;}
function xOptBtn(q,i,label,mode,done,pick,lock,isCut,cls){
 const rev=mode==="review",ok=(done||rev)&&i===q.ans,bad=rev&&pick===i&&i!==q.ans,sel=mode==="paper"&&pick===i;
 return `<button class="xopt ${cls||''} ${ok?'ok':''} ${bad?'bad':''} ${sel?'sel':''} ${isCut&&!done&&!rev?'cut':''}" data-q="${q.id}" data-i="${i}" ${done||rev||lock?'disabled':''}>${label}</button>`;}
function xKeyNotes(q,all){const fd=XFOUND[q.id]||new Set(),done=all||xKeysDone(q);
 const list=q.keys.map((k,i)=>done||fd.has(i)?`<li><mark class="xhl">${esc(k[0])}</mark> — ${esc(k[1])}</li>`:"").join("");
 return list?`<ul class="xkl">${list}</ul>`:"";}

/* ── 화면 ── */
function renderExamPrac(){
 S.exam=S.exam||{}; S.xfull=S.xfull||{};
 const open=xAllDone()||isT()||isG();
 if(!XMODE)XMODE=xAllDone()?"paper":"step";
 if(XMODE==="paper"&&!open)XMODE="step";
 const d=xDone(),fb=S.xfull.best;
 let h=`${hudBlock()}<h2 style="margin:18px 4px 4px;font-size:1.9rem">📝 시험 연습 — 정기시험처럼 풀어 보기</h2>
 <p class="small" style="margin:0 4px 10px">지구와 달의 운동 · 선택형 ${XQ.length}문항 + 논술형 ${XN.length}문항. 먼저 <b>한 문제씩</b> 조건을 찾아 가며 풀고, 선택형을 모두 맞히면 <b>실전 모드</b>가 열려요. <b>논술형</b>은 언제든 연습할 수 있어요.</p>
 <div class="xmodes"><button class="${XMODE==='step'?'on':''}" data-xm="step">① 한 문제씩 연습 <span class="pill ${d>=XQ.length?'g':d?'w':''}">${d}/${XQ.length}</span></button>
  <button class="${XMODE==='essay'?'on':''}" data-xm="essay">③ 논술형 연습 <span class="pill ${xnDone()>=XN.length?'g':xnDone()?'w':''}">${xnDone()}/${XN.length}</span></button>
  <button class="${XMODE==='paper'?'on':''}" data-xm="paper" ${open?'':'disabled'}>② 실전 모드 ${open?(fb!=null?`<span class="pill g">최고 ${fb}/${XTOTAL}점</span>`:'<span class="pill">열림</span>'):`<span class="small">🔒 ${XQ.length}문항을 모두 맞히면 열려요</span>`}</button></div>`;
 h+=XMODE==="step"?xStepHTML():XMODE==="essay"?xnHTML():xPaperHTML();
 app.innerHTML=h; drawHud(); xBind(); if(XMODE==="essay")xnBind();
 app.querySelectorAll("[data-xm]").forEach(b=>b.onclick=()=>{XMODE=b.dataset.xm;renderExamPrac();window.scrollTo(0,0);});}

function xStepHTML(){
 if(XCUR<0||XCUR>=XQ.length)XCUR=0;
 const q=XQ[XCUR],sv=S.exam[q.id]||{};
 let h=`<div class="xdots">${XQ.map((z,i)=>{const v=S.exam[z.id];return `<button class="${i===XCUR?'cur':''} ${v&&v.ok?'ok':''}" data-xj="${i}" title="${z.topic}">${i+1}</button>`;}).join("")}</div>`;
 if(XCUR===0&&!sv.ok&&!sv.t&&!xKeysDone(q))h+=`<div class="card" style="margin-top:8px"><h3>✏️ 처음 보는 정기시험, 이렇게 풀어요</h3><ol class="steps">
  <li><b>조건부터 찾기</b> — 시각(20시), 방향(서쪽 하늘), 간격(15일), ‘순서 없이’, ‘옳은 것만 있는 대로’처럼 답을 정하는 말을 먼저 찾아요</li>
  <li><b>그림의 기호</b>(A, B, (가)~(라), ㉮~㉵, ①~⑤)가 문제에서 모두 쓰인다는 걸 기억하기</li>
  <li>&lt;보기&gt;의 ㄱ, ㄴ, ㄷ을 <b>하나씩 끝까지 읽고 ○/✕</b>로 판단한 다음, ○만 모은 선택지를 골라요</li></ol></div>`;
 h+=`<div class="xpaper one"><div class="xhead"><b>${XCUR+1} / ${XQ.length}</b><span>${q.topic}</span></div>${xItemHTML(q,XCUR+1,"step")}
  <div class="xnav"><button class="btn-g" data-xj="${XCUR-1}" ${XCUR===0?'disabled':''}>← 이전 문제</button>${sv.ok&&!XRE[q.id]?`<button class="btn-g" data-xre="${q.id}">🔁 이 문제 다시 풀기</button>`:""}${sv.ok&&!XRE[q.id]?`<button class="btn-p" data-xj="${XCUR+1<XQ.length?XCUR+1:-1}">${XCUR+1<XQ.length?'다음 문제 →':(xAllDone()?'📝 실전 모드로 →':'안 푼 문제로 →')}</button>`:`<button class="btn-g" data-xj="${XCUR+1}" ${XCUR+1>=XQ.length?'disabled':''}>건너뛰기 →</button>`}</div></div>`;
 return h;}

function xPaperHTML(){
 if(!XPAPER)XPAPER={a:{},t0:Date.now(),sub:false};
 const rev=XPAPER.sub,n=Object.keys(XPAPER.a).length;let h="";
 if(rev){const r=XPAPER.res;h+=`<div class="card"><h3>📊 채점 결과 — <b style="color:var(--sun)">${r.s} / ${XTOTAL}점</b> <span class="small">(${r.c}/${XQ.length}문항 · ${r.min}분)</span></h3>
   <div class="xprog">${XTOPICS.map(t=>{const qs=XQ.filter(q=>q.topic===t),k=qs.filter(q=>XPAPER.a[q.id]===q.ans).length;return `<div><span>${t}</span><span class="pill ${k>=qs.length?'g':k?'w':''}">${k}/${qs.length}</span></div>`;}).join("")}</div>
   <p class="small" style="margin-top:8px">${r.pts?`첫 실전 제출 보너스 +${r.pts}점이 들어갔어요. `:''}틀린 문항은 아래에서 내 답과 정답, 보기마다의 까닭을 확인해 봐.</p>
   <button class="btn-p" id="xAgain" style="margin-top:6px">🔁 다시 풀기</button></div>`;}
 else h+=`<div class="card"><h3>📝 실전 모드 — 시험 시간처럼 쭉 풀어 보기</h3><p class="small">조건 찾기·해설 없이 시험지처럼 풀어요. ○/✕ 표시와 ✕ 지우기는 시험지에 연필로 쓰는 것처럼 쓸 수 있어요. 다 풀면 맨 아래 <b>제출하기</b>. 처음 제출할 때 맞힌 문항 수만큼 점수를 받아요.</p>
   <div class="xbar"><span>고른 답 <b id="xCnt">${n}</b> / ${XQ.length}</span><span>⏱ <b id="xClock">0:00</b></span></div></div>`;
 h+=`<div class="xpaper"><div class="xhead"><b>2026학년도 2학기 과학 · ${rev?'실전 연습 채점':'실전 연습'}</b><span>Ⅶ-2. 지구와 달의 운동 · ${XQ.length}문항 · ${XTOTAL}점</span></div><div class="xcols">`;
 const seen=new Set();
 XQ.forEach((q,i)=>{if(q.grp&&!seen.has(q.grp)){seen.add(q.grp);h+=`<div class="xgrpbox"><p class="xgrp"><b>${xGrpRange(q)}</b> ${esc(XG[q.grp].stem)} 물음에 답하시오.</p><div class="xfig xwide">${XG[q.grp].fig()}</div></div>`;}
  h+=xItemHTML(q,i+1,rev?"review":"paper");});
 h+=`</div>${rev?"":`<button class="btn-p" id="xSubmit" style="width:100%;margin-top:14px">제출하기</button><div id="xSubMsg"></div>`}</div>`;
 return h;}

function xBind(){
 app.querySelectorAll("[data-xj]").forEach(b=>b.onclick=()=>{let j=+b.dataset.xj;
  if(j===-1){if(xAllDone()){XMODE="paper";}else{j=XQ.findIndex(q=>!(S.exam[q.id]&&S.exam[q.id].ok));XCUR=j<0?0:j;}}else XCUR=j;
  renderExamPrac();window.scrollTo(0,0);});
 app.querySelectorAll(".xw").forEach(w=>w.onclick=()=>xTap(w));
 app.querySelectorAll("[data-xre]").forEach(b=>b.onclick=()=>{const id=b.dataset.xre;XRE[id]=1;XMARK[id]={};XCUT[id]={};XFOUND[id]=new Set();XMISS[id]=0;renderExamPrac();window.scrollTo(0,0);});
 app.querySelectorAll(".xshow").forEach(b=>b.onclick=()=>{const q=xItemById(b.dataset.q);XFOUND[q.id]=new Set(q.keys.map((k,i)=>i));xKeysFinished(q,true);});
 app.querySelectorAll(".xox button").forEach(b=>b.onclick=()=>{const id=b.dataset.q,l=b.dataset.l,m=(XMARK[id]=XMARK[id]||{});m[l]=m[l]===b.dataset.m?undefined:b.dataset.m;xRedraw(id);});
 app.querySelectorAll(".xstrike").forEach(b=>b.onclick=()=>{const id=b.dataset.q,c=(XCUT[id]=XCUT[id]||{});c[b.dataset.s]=!c[b.dataset.s];xRedraw(id);});
 app.querySelectorAll(".xopt[data-i]").forEach(b=>b.onclick=()=>{if(XMODE==="paper")xPaperPick(b.dataset.q,+b.dataset.i);else xPick(b.dataset.q,+b.dataset.i);});
 const sb=document.getElementById("xSubmit");if(sb)sb.onclick=xSubmit;
 const ag=document.getElementById("xAgain");if(ag)ag.onclick=()=>{XPAPER=null;XMARK={};XCUT={};renderExamPrac();window.scrollTo(0,0);};
 xClock();}
let XCLK=null;function xClock(){clearInterval(XCLK);const el=document.getElementById("xClock");if(!el||!XPAPER)return;
 const f=()=>{const e=document.getElementById("xClock");if(!e){clearInterval(XCLK);return;}const s=Math.floor((Date.now()-XPAPER.t0)/1000);e.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");};f();XCLK=setInterval(f,1000);}
function xRedraw(id){const q=XQ.find(z=>z.id===id),el=document.getElementById("xq_"+id);if(!el)return;const fe=document.getElementById("xf_"+id),f=fe?fe.innerHTML:"";
 const mode=XMODE==="paper"?(XPAPER&&XPAPER.sub?"review":"paper"):"step";
 const w=document.createElement("div");w.innerHTML=xItemHTML(q,XQ.indexOf(q)+1,mode);el.replaceWith(w.firstElementChild);const fn=document.getElementById("xf_"+id);if(fn)fn.innerHTML=f;xBind();}

function xTap(w){const id=w.dataset.q,q=xItemById(id),fd=(XFOUND[id]=XFOUND[id]||new Set());
 if(w.dataset.k!=null){const k=+w.dataset.k;if(fd.has(k))return;fd.add(k);
  if(fd.size>=q.keys.length){xKeysFinished(q,false);return;}
  if(q.subs){const y=window.scrollY;renderExamPrac();window.scrollTo(0,y);}else xRedraw(id);const m=document.getElementById("xm_"+id);if(m)m.innerHTML=`<span style="color:#1f7a4d">✔ 찾았다! 남은 조건 ${q.keys.length-fd.size}개</span>`;return;}
 XMISS[id]=(XMISS[id]||0)+1;w.classList.add("miss");setTimeout(()=>w.classList.remove("miss"),700);
 const m=document.getElementById("xm_"+id);if(m)m.innerHTML=`🤔 ‘${esc(w.textContent)}’도 읽어야 할 말이지만, 이 문제에서 <b>답을 가르는 조건</b>은 따로 있어. <b>시각·방향·간격</b>, <b>‘순서 없이’</b>, <b>‘옳은 것만 있는 대로’</b>, 그림의 기호처럼 놓치면 틀리는 말을 찾아봐.`;
 if(XMISS[id]===3)(q.subs?(()=>{const y=window.scrollY;renderExamPrac();window.scrollTo(0,y);})():xRedraw(id)),setTimeout(()=>{const mm=document.getElementById("xm_"+id);if(mm)mm.innerHTML="막히면 ‘남은 조건 보여 줘’를 눌러도 돼.";},0);}
function xKeysFinished(q,shown){if(q.subs){S.essay=S.essay||{};if(!XNRE[q.id]){S.essay[q.id]=S.essay[q.id]||{};S.essay[q.id].k=1;if(!isT()&&!isG())save();}const y=window.scrollY;renderExamPrac();window.scrollTo(0,y);toast(shown?"조건을 확인했어. 이제 써 보자!":"🔎 물음과 조건을 모두 찾았어!");return;}
 if(!XRE[q.id]){S.exam[q.id]=S.exam[q.id]||{t:0};S.exam[q.id].k=shown?2:1;if(!isT()&&!isG())save();}
 xRedraw(q.id);const f=document.getElementById("xf_"+q.id);if(f)f.innerHTML="";
 const el=document.querySelector(`#xq_${q.id} .xknotes`);if(el){el.open=true;}
 toast(shown?"조건을 확인했어. 이제 판단해 보자!":"🔎 조건을 모두 찾았어!");}

function xPick(id,i){
 const q=XQ.find(z=>z.id===id); const sv=S.exam[id]||{t:0};

/* ① 북두칠성의 운동 분석하기 — 각도기 도우미 (교과서 244쪽) */
ACT.dipper=(root,k,done)=>{
 const C=[190,310], RS=5.2; /* 1°(적위) = 5.2px */
 const DIP=STARS_NAMED.slice(1,8);       /* 북두칠성 7개 (첫 별 = 두베) */
 const T=[["㉮","20:00",225,"#5fe3ff"],["㉯","22:00",255,"#3fe6a6"],["㉰","24:00",285,"#ffb13b"]]; /* 두베의 시간각(°) */
 const D=S.dip=S.dip||{rho:200};
 const pos=(ra,dec,H0)=>{const H=(H0+(DIP[0][1]-ra)*15)*D2R, r=(90-dec)*RS; return [C[0]-r*Math.sin(H), C[1]-r*Math.cos(H)];};
 const lineAng=H0=>{const [x,y]=pos(DIP[0][1],DIP[0][2],H0); return wrap360(Math.atan2(C[1]-y,x-C[0])*R2D);}; /* 수학 각(반시계+) */
 const A=T.map(t=>lineAng(t[2]));
 const P=(ang,r)=>[C[0]+r*Math.cos(ang*D2R), C[1]-r*Math.sin(ang*D2R)];
 function prot(){const R=292, rho=D.rho; let g=`<path d="M${P(rho,R).join(" ")} A${R} ${R} 0 0 0 ${P(rho+180,R).join(" ")} Z" fill="#ffffff10" stroke="#e6faf4" stroke-width="1.5"/>`;
  for(let i=0;i<=180;i+=2){const big=i%10===0, mid=i%5===0;const [x1,y1]=P(rho+i,R),[x2,y2]=P(rho+i,R-(big?16:mid?10:6));g+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#e6faf4" stroke-width="${big?1.6:0.8}" opacity=".85"/>`;
   if(big){const [tx,ty]=P(rho+i,R-30);g+=`<text x="${tx.toFixed(1)}" y="${(ty+5).toFixed(1)}" text-anchor="middle" font-size="13" font-weight="700" fill="#ffe0a8">${i}</text>`;const [ux,uy]=P(rho+i,R-50);g+=`<text x="${ux.toFixed(1)}" y="${(uy+4).toFixed(1)}" text-anchor="middle" font-size="10" fill="#86b3a8">${180-i}</text>`;}}
  const [bx,by]=P(rho,R),[ex,ey]=P(rho+180,R); g+=`<line x1="${bx.toFixed(1)}" y1="${by.toFixed(1)}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="#e6faf4" stroke-width="1.5"/><circle cx="${C[0]}" cy="${C[1]}" r="5" fill="none" stroke="#ff6b6b" stroke-width="2"/>`;
  return g;}
 let ANIM=null; /* {i, h} — i번째 위치에서 다음 위치로 움직이는 중 */
 const stage=()=>Math.max(0,Math.min(2,D.stage||0));
 const clock=m=>{const h=Math.floor(m/60)%24, mm=Math.round(m%60); return (h===0?"24":String(h).padStart(2,"0"))+":"+String(mm).padStart(2,"0");};
 function dipper(H0,col,lab,tm,fade){const pts=DIP.map(s=>pos(s[1],s[2],H0)); const [dx,dy]=pts[0]; const L=300;
  const ux=(dx-C[0]), uy=(dy-C[1]), n=Math.hypot(ux,uy); const ex=C[0]+ux/n*L, ey=C[1]+uy/n*L;
  let g=`<line x1="${C[0]}" y1="${C[1]}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="${col}" stroke-width="2" stroke-dasharray="7 5"/>`;
  g+=`<g opacity="${fade?0.45:1}">`;
  [[0,1],[1,2],[2,3],[3,0],[3,4],[4,5],[5,6]].forEach(([a,b])=>g+=`<line x1="${pts[a][0].toFixed(1)}" y1="${pts[a][1].toFixed(1)}" x2="${pts[b][0].toFixed(1)}" y2="${pts[b][1].toFixed(1)}" stroke="${col}" stroke-width="1.6" opacity=".8"/>`);
  pts.forEach((p,j)=>g+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${j===0?5:3.8}" fill="#fff" ${j===0?`stroke="${col}" stroke-width="2"`:''}/>`);
  if(lab)g+=`<text x="${(dx+12).toFixed(1)}" y="${(dy+5).toFixed(1)}" font-size="17" font-weight="800" fill="${col}" paint-order="stroke" stroke="#03110d" stroke-width="4">${lab} ${tm}</text>`;
  return g+`</g>`;}
 function svg(){ const st=stage(); let g=`<svg viewBox="0 0 640 620" style="width:100%;display:block;touch-action:none;user-select:none"><rect width="640" height="620" rx="16" fill="#03110d"/>`;

  const shown=ANIM?ANIM.i:st;

  if(ANIM){const col=T[ANIM.i+1][3]; g+=dipper(ANIM.h,col,"","",false);}

  if(D.dir&&st===2&&!ANIM){const r=105, a0=A[0]+4, a1=A[2]-4, cw=D.dir==="cw"; const s0=cw?a1:a0, s1=cw?a0:a1; const [x0,y0]=P(s0,r),[x1,y1]=P(s1,r);
   g+=`<defs><marker id="dpA" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="${D.dir==='ccw'?'#3fe6a6':'#ff6b6b'}"/></marker></defs><path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 0 ${cw?1:0} ${x1.toFixed(1)} ${y1.toFixed(1)}" fill="none" stroke="${D.dir==='ccw'?'#3fe6a6':'#ff6b6b'}" stroke-width="4" marker-end="url(#dpA)"/>`;}
  if(D.prot&&st===2)g+=prot();
  g+=`<circle cx="${C[0]}" cy="${C[1]}" r="6" fill="#ffd166"/><text x="${C[0]-12}" y="${C[1]-12}" text-anchor="end" font-size="16" font-weight="800" fill="#ffd166" paint-order="stroke" stroke="#03110d" stroke-width="4">북극성</text></svg>`; return g;}
 function advance(){ const st=stage(); if(ANIM||st>=2)return; const h0=T[st][2], h1=T[st+1][2], t0=performance.now(), dur=1600;

function lunarStart(d){ /* 그 달의 삭이 든 날(한국 날짜 번호) = 음력 1일 */
 let t=new Date(d.getTime()-31*864e5), nm=Astronomy.SearchMoonPhase(0,t,40).date;
 for(let i=0;i<3;i++){const nx=Astronomy.SearchMoonPhase(0,new Date(nm.getTime()+864e5),40); if(nx&&kDay(nx.date)<=kDay(d))nm=nx.date; else break;}
 return kDay(nm);}

 return `<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" fill="#2b3442"/><path d="M50 6A44 44 0 0 1 50 94A${Math.abs(k).toFixed(2)} 44 0 0 ${k>0?0:1} 50 6Z" fill="#f3ecd2" ${wax?"":'transform="translate(100 0) scale(-1 1)"'}/></svg>`;}
