 const filled=Object.keys(m).filter(k=>+k>=k0&&+k<=k1).length, lunOf=k=>lunarDay(new Date(k*864e5+3*36e5)), phOf=k=>Astronomy.MoonPhase(new Date(k*864e5+12*36e5));

 const L=m[moonSel]||[];
 app.innerHTML=`${hudBlock()}
 <div style="display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin:18px 4px 4px"><div style="flex:1;min-width:240px"><h2 style="font-size:1.9rem">🌙 달 관측 앨범</h2>

  <div style="min-width:220px"><div class="small">사진 <b style="color:var(--fg)">${MOON.length}</b>장 · 승무원 ${who}명 · ${NC}칸 중 <b style="color:var(--sun)">${filled}</b>칸</div>
   <div style="height:10px;border-radius:99px;background:#ffffff14;overflow:hidden;margin-top:4px"><i style="display:block;height:100%;width:${filled/30*100}%;background:linear-gradient(90deg,var(--cyan),var(--sun))"></i></div></div></div>

   ${L.length?`<div class="mdet">${L.map(moonCard).join("")}</div>`:`<p class="small" style="margin-top:8px">${moonSel>tk?"아직 오지 않은 날이에요. 이날 달은 이런 모양일 거예요.":"이날 사진이 아직 없어요."}</p><div style="width:110px">${moonSVG(phOf(moonSel))}</div>`}</div>`
 :`<div class="mgal">${MOON.length?MOON.map(e=>`<button class="mgi" data-md="${kDay(e.d)}"><img src="${e.img}" alt="" loading="lazy"><b>양력 ${moonFmt(e.d)} · 음력 ${e.lunar}일</b><span class="small" style="font-size:.78rem">${esc(e.cls)}${e.cls?"반 ":""}${esc(e.name)}</span></button>`).join(""):`<p class="small">아직 사진이 없어요. 첫 사진의 주인공이 되어 보세요!</p>`}</div>`}`;
 drawHud();
 const ub=document.getElementById("mUpBtn"); if(ub)ub.onclick=()=>{moonUpOpen=!moonUpOpen;MU=null;renderMoon();};

 app.querySelectorAll("[data-mdel]").forEach(b=>b.onclick=async()=>{ if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="한 번 더 누르면 지워요";setTimeout(()=>{if(b.isConnected){b.dataset.sure="";b.textContent="🗑 지우기";}},3000);return;}

   else{try{localStorage.setItem(LSM,JSON.stringify(moonLocal().filter(x=>x.id!==b.dataset.mdel)));}catch(x){}}
   MOON=MOON.filter(x=>x.id!==b.dataset.mdel);toast("사진을 지웠어요");renderMoon();}catch(e){toast("지우기 실패: "+e);b.disabled=false;}});

function moonUpHTML(){const n=new Date(),p=x=>String(x).padStart(2,"0"),iso=d=>`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
 return `<div class="card"><h3>📷 달 사진 올리기</h3><p class="small" style="margin:2px 0 12px">내가 직접 찍은 달 사진만 올려요. 인터넷에서 가져온 사진은 안 돼요. 사진의 위치 정보는 올릴 때 지워져요.</p>
 <div class="mup"><div style="display:flex;flex-direction:column;gap:10px">
   <label>① 사진 고르기<input type="file" id="mFile" accept="image/*" style="color:var(--fg)"></label>
   <canvas id="mCrop" width="400" height="400"></canvas>
   <label>② 달이 가운데에 크게 오도록 — 사진을 끌어 옮기고, 아래 막대로 확대<input type="range" id="mZoom" min="1" max="10" step="0.1" value="1"></label></div>
  <div style="display:flex;flex-direction:column;gap:10px">
   <label>③ 찍은 날짜와 시각<input type="datetime-local" id="mWhen" value="${iso(n)}" min="2026-11-19T00:00" max="${iso(n)}"></label>
   ${isT()?`<div style="display:grid;grid-template-columns:1fr 2fr;gap:8px"><label>반<input type="text" id="mCls" placeholder="예) 3"></label><label>찍은 학생 이름<input type="text" id="mName" placeholder="카톡으로 받은 사진을 대신 올릴 때"></label></div>`:""}
   <label>달이 있던 쪽<select id="mDir"><option value="">모르겠어요</option><option>동쪽</option><option>남쪽</option><option>서쪽</option></select></label>
   <label>한마디 (선택)<input type="text" id="mMemo" maxlength="80" placeholder="예) 학원 끝나고 집에 가다가 찍었어요"></label>
   <div style="display:flex;gap:12px;align-items:center"><div id="mCalc" style="width:84px;flex:0 0 auto"></div><div class="small" id="mCap"></div></div>
   <button class="btn-p" id="mSend" style="min-height:48px">앨범에 올리기</button></div></div></div>`;}
function moonUpBind(){
 const cv=document.getElementById("mCrop"),x=cv.getContext("2d"),zm=document.getElementById("mZoom"),wh=document.getElementById("mWhen");
 const draw=()=>{x.fillStyle="#02070c";x.fillRect(0,0,400,400); if(!MU){x.fillStyle="#9fb3c3";x.font="16px sans-serif";x.textAlign="center";x.fillText("사진을 고르면 여기에 보여요",200,205);return;}
  const s=Math.min(MU.w,MU.h)/MU.z; MU.cx=Math.max(s/2,Math.min(MU.w-s/2,MU.cx)); MU.cy=Math.max(s/2,Math.min(MU.h-s/2,MU.cy)); x.drawImage(MU.im,MU.cx-s/2,MU.cy-s/2,s,s,0,0,400,400);};
 const calc=()=>{const d=new Date(wh.value); if(isNaN(d))return; const n=lunarDay(d); document.getElementById("mCalc").innerHTML=moonSVG(Astronomy.MoonPhase(d));
  document.getElementById("mCap").innerHTML=`<b style="color:var(--fg)">양력 ${solTxt(kDay(d))} → 음력 ${n}일 · ${moonNear(n)}</b><br>그날 계산한 달 모양이에요. 내 사진과 같은지 비교해 보세요.`;};
 wh.oninput=calc; calc(); draw();
 document.getElementById("mFile").onchange=ev=>{const f=ev.target.files[0]; if(!f||!f.type.startsWith("image/"))return; const u=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{MU={im,w:im.naturalWidth,h:im.naturalHeight,z:1,cx:im.naturalWidth/2,cy:im.naturalHeight/2};zm.value=1;
   if(f.lastModified){const d=new Date(f.lastModified); if(d>=MOON_FROM&&d<=new Date()){const p=n=>String(n).padStart(2,"0");wh.value=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;calc();}}
   draw();}; im.onerror=()=>toast("이 사진은 열 수 없어요. 다른 사진을 골라 주세요"); im.src=u;};
 zm.oninput=()=>{if(MU){MU.z=+zm.value;draw();}};
 let drag=null; cv.onpointerdown=e=>{if(!MU)return;drag={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);};
 cv.onpointermove=e=>{if(!drag||!MU)return;const k=(Math.min(MU.w,MU.h)/MU.z)/cv.getBoundingClientRect().width;MU.cx-=(e.clientX-drag.x)*k;MU.cy-=(e.clientY-drag.y)*k;drag={x:e.clientX,y:e.clientY};draw();};
 cv.onpointerup=cv.onpointercancel=()=>{drag=null;};
 document.getElementById("mSend").onclick=async()=>{ if(moonBusy)return; if(!MU){toast("먼저 달 사진을 골라 주세요");return;}
  const d=new Date(wh.value); if(isNaN(d)){toast("찍은 날짜와 시각을 넣어 주세요");return;} if(d<MOON_FROM||d>MOON_TO){toast("11월 19일부터 12월 20일 사이에 찍은 사진만 올릴 수 있어요");return;} if(d>new Date(Date.now()+6e5)){toast("아직 오지 않은 시각이에요");return;}
  let q=.8,img=cv.toDataURL("image/jpeg",q); while(img.length>46000&&q>.3){q-=.08;img=cv.toDataURL("image/jpeg",q);}
  const fc=document.createElement("canvas"),fs=Math.min(1,1280/Math.max(MU.w,MU.h));fc.width=Math.round(MU.w*fs);fc.height=Math.round(MU.h*fs);fc.getContext("2d").drawImage(MU.im,0,0,fc.width,fc.height);
  const who=isT()?{cls:(document.getElementById("mCls").value||"").trim(),num:"",name:(document.getElementById("mName").value||"").trim()||"센터장"}:{cls:me.cls,num:me.num,name:me.name};
  const row={t:d.toISOString(),lunar:lunarDay(d),dir:document.getElementById("mDir").value,memo:document.getElementById("mMemo").value.trim(),img,...who};
  const bt=document.getElementById("mSend"); moonBusy=true; bt.disabled=true; bt.textContent="올리는 중…";
  try{ let id; if(API){const r=await post({action:"moonUp",...row,full:fc.toDataURL("image/jpeg",.85)});id=r.id;}
   else{id="L"+Date.now();const L=moonLocal();L.push({id,...row,same:0,diff:0});try{localStorage.setItem(LSM,JSON.stringify(L));}catch(e){}}
   MOON.push({id,...row,mine:true,same:0,diff:0,d,name:isT()?who.name:maskName(who.name)}); MOON.sort((a,b)=>a.d-b.d);
   moonSel=kDay(d); moonTab="cal"; moonUpOpen=false; MU=null; toast(`${solOf(kDay(d)).m}/${solOf(kDay(d)).d}(음력 ${row.lunar}일) 칸에 올렸어요!`);
   if(!isT()){S.moon=S.moon||{}; const k=String(kDay(new Date())); if(!S.moon[k]&&Object.keys(S.moon).length<10){S.moon[k]=1;addPts(3);} logSrv("달앨범","음력 "+row.lunar+"일",row.memo||"",3,"");}
   renderMoon(); }
  catch(e){toast("올리기 실패: "+e+" (Code.gs를 최신판으로 바꿔 새 버전 배포가 필요할 수 있어요)");bt.disabled=false;bt.textContent="앨범에 올리기";}
  moonBusy=false; };
}

function renderComms(){
  app.innerHTML=`${hudBlock()}<h2 style="margin:18px 4px 4px;font-size:1.9rem">📡 교신 채널</h2>
  <p class="small" style="margin:0 4px 10px">${isG()?`🎩 <b style="color:var(--violet)">참관 — ${esc(me.cls)}반 승무원들의 교신</b>이에요. 학생 이름은 가리고 보여 드려요.`:isT()?'센터장은 모든 반의 교신을 볼 수 있어요. 반을 골라 보세요.':(CM.other?`<b style="color:var(--violet)">🔭 다른 반 교신 구경 중</b> — 이름은 가려지고, 읽기만 할 수 있어요.`:`<b style="color:var(--cyan)">${esc(me?me.cls:"")}반 교신</b>이에요. 다른 반 교신은 <b>구경하기</b>로 볼 수 있어요.`)} 왼쪽 칸은 ❓ 질문, 오른쪽 칸은 💡 알게 된 점 — 칸 안에서 미션별로 나뉩니다. 모르는 질문에 답해 보는 것도 훌륭한 훈련 — AI가 읽고 괜찮은 응답이면 +2점 (최대 50건).</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px">
   ${isT()?`<select id="cmCls" style="width:auto;padding:8px 12px"><option value="">모든 반</option>${CM.cls?`<option value="${esc(CM.cls)}" selected>${esc(CM.cls)}반</option>`:''}</select>`:''}
   <select id="cmMission" style="width:auto;padding:8px 12px"><option value="">모든 미션</option>${CH.map(c=>`<option value="${c.no}" ${CM.mission===c.no?'selected':''}>${c.no} ${c.title}</option>`).join("")}</select>
   ${isT()||isG()?'':`<button class="${CM.other?'btn-s':'btn-g'}" id="cmOther" style="min-height:44px;${CM.other?'border-color:var(--violet);color:var(--violet)':''}">${CM.other?'← 우리 반 교신으로':'🔭 다른 반 교신 구경하기'}</button>`}
   <button class="btn-g" id="cmMine" ${CM.other||isG()?'hidden':''} style="min-height:44px;${CM.mine?'border-color:var(--sun);color:var(--sun)':''}">${CM.mine?'✓ ':''}내 교신만</button>
   <button class="btn-g" id="cmNoans" ${CM.other||isG()?'hidden':''} style="min-height:44px;${CM.noans?'border-color:var(--sun);color:var(--sun)':''}">${CM.noans?'✓ ':''}응답 없는 질문</button>
   <button class="btn-s" id="cmReload" style="min-height:44px">새로고침</button>
   <button class="btn-p" id="cmNew" ${CM.other||isG()?'hidden':''} style="min-height:44px;margin-left:auto;font-size:1rem">${CM.compose?'✕ 닫기':'✏️ 새 교신 보내기'}</button></div>
  <div id="cmCompose" ${CM.compose?'':'hidden'}>${commsComposeHTML(CM.mission||CH[0].no,"출발 전",{pick:true})}
   ${API?"":'<div class="fb no">서버 미연결: 교신이 이 기기에만 저장됩니다. 센터장이 시트를 연결하면 학급 전체가 함께 봅니다.</div>'}</div>
  <div id="cmStat"></div><div id="cmList"><p class="small">불러오는 중…</p></div>`;
  drawHud();
  bindCompose(app.querySelector("#cmCompose"),CM.mission||CH[0].no,"출발 전",()=>{CM.compose=false;setTimeout(()=>{toast("📡 교신 발신 완료!");render();},400);});
  app.querySelector("#cmMission").onchange=e=>{CM.mission=e.target.value;render();};
  const cc=app.querySelector("#cmCls"); if(cc)cc.onchange=e=>{CM.cls=e.target.value;render();};
  const co=app.querySelector("#cmOther"); if(co)co.onclick=()=>{CM.other=!CM.other;CM.mine=false;CM.noans=false;CM.compose=false;render();};
  app.querySelector("#cmMine").onclick=()=>{CM.mine=!CM.mine;render();}; app.querySelector("#cmNoans").onclick=()=>{CM.noans=!CM.noans;render();};
  app.querySelector("#cmReload").onclick=loadComms;
  app.querySelector("#cmNew").onclick=()=>{CM.compose=!CM.compose;render();};
  loadComms();
}
const CM_PH={"출발 전":["❓","출발 전 질문"],"귀환 후":["❓","귀환 후 질문"],"귀환 보고":["💡","알게 된 점"]};
function cmCard(r){
  const ans=r.answers||[], open=CM.open&&CM.open[r.id], shown=open?ans:ans.slice(-2), ph=CM_PH[r.phase]||["❓",r.phase];
  const who=r.ro?`${esc(r.cls)}반 승무원`:r.name==="익명 승무원"?"익명":`${esc(r.cls)}반 ${esc(r.name)}`;
  return `<div class="cmq ${ans.length?'done':'wait'} ${r.mine?'mine':''}" data-q="${esc(r.id)}" data-k="${r.phase==="귀환 보고"?1:""}">
   <div class="cmmeta">${(!CM.mission&&r.phase!=="귀환 보고")?`<span class="cmph">${r.phase==="출발 전"?"출발 전":"귀환 후"}</span>`:''}<span>${who}</span><span>${esc((r.t||'').slice(5,16).replace('T',' '))}</span>${r.mine?'<span class="pill w" style="margin:0">내 교신</span>':''}<span class="cmn">${r.phase==="귀환 보고"?(ans.length?`댓글 ${ans.length}`:''):(ans.length?`응답 ${ans.length}`:'응답 기다림')}</span></div>
   <p class="cmtx">${esc(r.text)}</p>
   ${ans.length>shown.length?`<button class="cmmore" data-more="${esc(r.id)}">이전 응답 ${ans.length-shown.length}개 더 보기</button>`:''}
   ${shown.map(a=>`<div class="cma ${a.teacher?'t':''}"><b>${a.teacher?'🎖️ 센터장':'💬 '+(r.ro?(a.cls?esc(a.cls)+'반 ':'')+'승무원':esc(a.name))}</b> <span class="small">${esc((a.t||'').slice(5,16).replace('T',' '))}</span>${isT()&&a.id&&API?`<button class="cmdel" data-adel="${esc(a.id)}" title="이 응답 지우기" aria-label="이 응답 지우기">🗑</button>`:''}<div>${esc(a.text)}</div></div>`).join("")}
   ${r.ro?'':`<button class="cmrep" data-rep="${esc(r.id)}" data-lab="${r.phase==="귀환 보고"?"👍 댓글 달기":"응답하기"}">${r.phase==="귀환 보고"?"👍 댓글 달기":"응답하기"}</button>
   <div class="cmbox" hidden><textarea class="ansIn" placeholder="아는 만큼, 근거와 함께"></textarea><button class="btn-s ansBtn" style="min-height:44px;width:100%;margin-top:6px">${ansBtnLabel()}</button><div class="ansFb"></div></div>`}</div>`;
}
async function loadComms(){
  const L=document.getElementById("cmList"), ST=document.getElementById("cmStat"); if(!L)return;
  const RO=(!isT()&&CM.other)||isG(); /* 다른 반 구경·참관: 이름 가림 · 읽기 전용 */
  try{let every=(await commsList({cls:(isT()||(RO&&!isG()))?"":(me?me.cls:""),mission:CM.mission})).filter(r=>r.phase!=="분류회의");
    if(isG())every=every.filter(r=>String(r.cls)===String(me.cls)).map(r=>({...r,mine:false,ro:true}));
    else if(RO)every=every.filter(r=>me&&String(r.cls)!==String(me.cls)).map(r=>({...r,mine:false,ro:true}));
    const cc=document.getElementById("cmCls"); if(cc){const cls=[...new Set(every.map(r=>String(r.cls)).filter(x=>x&&x!=="T"))].sort((a,b)=>(+a||0)-(+b||0)||a.localeCompare(b));
      cc.innerHTML=`<option value="">모든 반</option>`+cls.map(x=>`<option value="${esc(x)}" ${CM.cls===x?'selected':''}>${esc(x)}반</option>`).join("");}
    const all=isT()&&CM.cls?every.filter(r=>String(r.cls)===CM.cls):every; let rows=all;
    if(CM.mine)rows=rows.filter(r=>r.mine); if(CM.noans)rows=rows.filter(r=>r.phase!=="귀환 보고"&&!(r.answers||[]).length);
    const qN=all.filter(r=>r.phase!=="귀환 보고").length, wait=all.filter(r=>r.phase!=="귀환 보고"&&!(r.answers||[]).length).length, mineN=all.filter(r=>r.mine).length;
    if(ST)ST.innerHTML=RO?(all.length?`<div class="cmstat"><span>🔭 다른 반 ❓ 질문 <b>${qN}</b></span><span>💡 알게 된 점 <b>${all.length-qN}</b></span><span style="color:var(--mut)">응답은 우리 반 교신에만 달 수 있어요</span></div>`:""):all.length?`<div class="cmstat"><span>❓ 질문 <b>${qN}</b> <span style="border:0;padding:0;background:none">(응답 받음 ${qN-wait})</span></span><span>💡 알게 된 점 <b>${all.length-qN}</b></span><button id="cmWaitBtn" class="${CM.noans?'on':''}">🔍 응답 기다리는 질문 <b>${wait}</b> ${CM.noans?'· 전체 보기':'· 보러 가기'}</button><span>🧑‍🚀 내 교신 <b>${mineN}</b></span></div>`:"";
    const wb=document.getElementById("cmWaitBtn"); if(wb)wb.onclick=()=>{CM.noans=!CM.noans;render();};
    if(!rows.length){const f=[CM.mission&&CM.mission,CM.mine&&"내 교신만",CM.noans&&"응답 없는 질문"].filter(Boolean);
      L.innerHTML=f.length?`<div class="card"><p class="small">조건(<b>${esc(f.join(" · "))}</b>)에 맞는 교신이 없어요.</p><button class="btn-s" id="cmClear" style="min-height:44px">조건 모두 풀고 전체 보기</button></div>`:(RO?'<div class="card"><p class="small">아직 다른 반 교신이 없어요.</p></div>':'<div class="card"><p class="small">아직 교신이 없어요. 첫 교신을 보내 보세요!</p></div>');
      const cb=L.querySelector("#cmClear"); if(cb)cb.onclick=()=>{CM.mission="";CM.mine=false;CM.noans=false;CM.cls="";render();}; return;}
    /* 칸 나누기: 모든 미션 → 미션별 칸 / 미션 하나 → 단계별 칸 (힘탐정사무소 차시별 칸과 같은 방식) */
    /* 칸은 언제나 두 개: ❓ 질문 | 💡 알게 된 점. 칸 안에서 미션별(미션 하나면 출발 전/귀환 후)로 구분선 */
    const isQ=r=>r.phase!=="귀환 보고";
    const groups=(items,q)=>CM.mission
      ? (q?[["출발 전","출발 전 질문"],["귀환 후","귀환 후 질문"]].map(([ph,h])=>({h,items:items.filter(r=>r.phase===ph)})):[{h:"",items}])
      : CH.map(c=>({h:`${c.no} · ${c.title}`,items:items.filter(r=>r.mission===c.no)}));
    const col=(cls,h,items,q)=>`<div class="cmcol ${cls}"><h3>${h}<span>${items.length}</span></h3><div class="inner">${items.length?groups(items,q).filter(g=>g.items.length).map(g=>(g.h?`<div class="cmdiv">${esc(g.h)} <b>${g.items.length}</b></div>`:"")+g.items.map(cmCard).join("")).join(""):`<p class="small" style="grid-column:1/-1;margin:6px 4px">${q?"아직 질문 교신이 없어요.":"아직 알게 된 점 교신이 없어요. 귀환 교신에서 💡 칸에 써 보세요!"}</p>`}</div></div>`;
    L.innerHTML=`<div class="cmboard two">${col("q","❓ 질문",rows.filter(isQ),true)}${col("k","💡 알게 된 점",rows.filter(r=>!isQ(r)),false)}</div>`;
    L.querySelectorAll("[data-more]").forEach(b=>b.onclick=()=>{CM.open=CM.open||{};CM.open[b.dataset.more]=1;loadComms();});
    L.querySelectorAll("[data-rep]").forEach(b=>b.onclick=()=>{const bx=b.nextElementSibling;bx.hidden=!bx.hidden;b.textContent=bx.hidden?b.dataset.lab:"취소";if(!bx.hidden)bx.querySelector("textarea").focus();});
    L.querySelectorAll(".ansBtn").forEach(b=>b.onclick=()=>sendAnswer(b,false));
    L.querySelectorAll("[data-adel]").forEach(b=>b.onclick=async()=>{ if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="정말 지울까요? 한 번 더 누르기";return;}
      b.disabled=true; try{const r=await post({action:'adel',pin:TPIN,id:b.dataset.adel}); if(r&&r.ok===false)throw r.error; toast("응답을 지웠어요"); loadComms();}catch(e){toast("지우기 실패: "+e+" (Code.gs를 최신판으로 바꿔 새 버전 배포가 필요할 수 있어요)");b.disabled=false;} });
  }catch(e){L.innerHTML=`<div class="fb no">교신 채널 연결 실패: ${esc(e)}</div>`;}
}


/* 성의 없는 응답 거르기 — AI가 없거나 연결이 안 돼도 항상 먼저 확인한다 */
function ansLazy(t){
  const core=t.replace(/[\s.,!?~…·'"“”‘’()\-ㅋㅎㅠㅜ]/g,"");
  if(core.length<6) return "조금 더 자세히 써 볼까요? <b>무엇이 · 왜</b> 그런지 한 문장으로 적어 주세요.";
  if(/^(네|넹|넵|예|응|어|아니요|아니오|아뇨|아님|몰라요|모름|모르겠어요|있어요|없어요|있습니다|없습니다|맞아요|맞습니다|그렇다|아니다)/.test(core)&&core.length<10)
    return "‘네/아니요’ 다음에 <b>그렇게 생각한 까닭</b>을 한 가지 덧붙여 주세요. (예: “네, ○○ 때문이에요.”)";
  if(/([^0-9])\1{3,}/.test(core)||/^[a-zA-Z0-9]+$/.test(core)) return "질문에 맞는 내용을 문장으로 적어 주세요.";
  return "";
}
/* 응답 보내기 — 먼저 성의 확인, 그다음 AI가 읽고 '하'면 고쳐 쓰게 한다. AI가 꺼져 있거나 연결이 안 되면 성의 확인만 하고 보낸다 */
async function sendAnswer(b,force){
  const card=b.closest("[data-q]"),inp=card.querySelector(".ansIn"),out=card.querySelector(".ansFb"),t=inp.value.trim();
  if(t.length<2)return toast("응답을 적어 주세요");
  const left=ansLeft(), scoring=!isT()&&!isG()&&left>0;
  const norm=t.replace(/[\s.,!?~…·'"“”‘’()\-ㅋㅎㅠㅜ]/g,""); S.comms=S.comms||{}; const sent=S.comms.ansH||[];
  const dup=scoring&&!force&&norm.length>0&&sent.includes(norm);
  const lazy=dup?"전에 보낸 응답과 <b>똑같아요</b>. 이 질문에 맞게 <b>내 말로</b> 다시 써 주세요.":(scoring&&!force?ansLazy(t):"");
  if(lazy){ if(out)out.innerHTML=`<div class="fb no" style="margin-top:8px"><b>✍️ 조금만 더!</b> ${lazy}<div class="small">고쳐서 보내면 +${ANS_PTS}점이에요.</div><button class="cmmore ansForce" style="margin-top:6px">점수 없이 그대로 보내기</button></div>`;
    const f=out&&out.querySelector(".ansForce"); if(f)f.onclick=()=>sendAnswer(b,true); inp.focus(); return; }
  let lvl=null;
  b.disabled=true;
  if(scoring&&AI_ON&&API&&!force){
    const lab=b.textContent; b.textContent="🤖 AI가 응답을 읽는 중… (5~10초)"; if(out)out.innerHTML="";
    try{const q=(card.querySelector(".cmtx")||{}).textContent||"";
      const res=await post({action:'feedback',nolog:(me&&me.cls==="T")?'1':'',...me,item:'교신응답',rubric:ansRubric(q,card.dataset.k==="1"),text:t,score:''});
      const fb=res&&res.fb; lvl=fb&&fb.level||null;
      if(lvl==="하"){
        b.textContent=lab; b.disabled=false;
        out.innerHTML=`<div class="fb no" style="margin-top:8px"><b>🤖 조금만 고쳐 볼까요?</b><ul class="cklist">${(fb.improve||[]).map(g=>`<li class="n">${esc(g)}</li>`).join("")}</ul><div class="small">고쳐서 다시 보내면 +${ANS_PTS}점을 받을 수 있어요.</div><button class="cmmore ansForce" style="margin-top:6px">AI 판단이 틀린 것 같아요 — 점수 없이 그대로 보내기</button></div>`;
        out.querySelector(".ansForce").onclick=()=>sendAnswer(b,true); inp.focus(); return;}
    }catch(e){lvl=null;}
  }
  try{
    await commsAnswer(card.dataset.q,t);
    S.comms.ansH=(S.comms.ansH||[]).concat([norm]).slice(-80);
    if(scoring&&!force){S.comms.ans=(S.comms.ans||0)+1; addPts(ANS_PTS); if(lvl==="상")setTimeout(()=>toast("🤖 근거까지 든 멋진 응답!"),700);}
    else save();
    CM.open=CM.open||{};CM.open[card.dataset.q]=1; loadComms();
  }catch(e){toast("응답 실패: "+e);b.disabled=false;b.textContent=ansBtnLabel();}
}

/* ═══════ 내비 ═══════ */
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{view=b.dataset.v;deck=null;render();});
document.addEventListener("keydown",e=>{if(!deck)return;if(e.target.closest("textarea,input"))return;
 if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();const n=stage.querySelector("#next");if(n)n.click();}
 if(e.key==="ArrowLeft"){e.preventDefault();const p=stage.querySelector("#prev");if(p&&!p.disabled)p.click();}
 if(e.key==="Escape"){deck=null;view="learn";render();}});
(function(){const h=(location.hash||"").replace("#","");const m=h.match(/^(c[1-5])s(\d+)$/);
 if(m){const ci=CH.findIndex(c=>c.id===m[1]);if(ci>=0){deck={ch:ci,i:Math.min(+m[2]-1,CH[ci].slides.length-1)};view="learn";}}
 else if(["home","crew","learn","obs","moon","comms","teacher"].includes(h))view=h;})();
if(me){loadLocal(); if(API){call({action:'ping'}).then(r=>{AI_ON=!!r.ai;setSync('on');showAI();}).catch(()=>setSync('err'));}}
render();
</script>
